<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWSZ DOOH Admin Portal</title>
<style>
:root{
--bg:#f4f7fb;--white:#fff;--blue:#246bce;--blue2:#123b70;--ink:#20272e;
--muted:#68798b;--line:#d9e4ee;--soft:#eaf3fc;--green:#20855a;--greenbg:#eaf7f0;
--amber:#b97918;--amberbg:#fff5df;--red:#c33d3d;--redbg:#fff0f0;
--shadow:0 12px 35px rgba(27,63,98,.08);--r:18px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:22px 15px;display:flex;flex-direction:column;z-index:30}
.brand{font-size:27px;font-weight:900;color:var(--blue2)}
.brand span{font-weight:500;color:var(--muted)}
.side-brand{padding:4px 10px 22px;border-bottom:1px solid var(--line)}
.nav{padding-top:16px;display:grid;gap:4px;overflow:auto}
.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:12px;color:#526579;font-weight:700}
.nav button:hover,.nav button.active{background:var(--soft);color:var(--blue2)}
.side-bottom{margin-top:auto}
.main{margin-left:255px;min-width:0;width:calc(100% - 255px)}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}
.top-left{display:flex;align-items:center;gap:12px}
.crumb{font-weight:850}
.top-actions{display:flex;align-items:center;gap:8px}
.content{padding:28px;max-width:1550px;margin:auto}
.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}
.head h1{font-size:27px;margin:0 0 6px}
.head p{margin:0;color:var(--muted)}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.stat-label{color:var(--muted);font-size:13px;font-weight:700}
.stat-value{font-size:29px;font-weight:900;margin-top:7px;color:var(--blue2)}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750}
.btn-primary{background:var(--blue);color:#fff}
.btn-soft{background:var(--soft);color:var(--blue2)}
.btn-danger{background:var(--redbg);color:var(--red)}
.btn-green{background:var(--greenbg);color:var(--green)}
.btn-small{padding:8px 11px;font-size:13px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}
.field input,.field textarea,.field select{
width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;outline:0;color:var(--ink)
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#8ab7e8}
textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.table th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.table tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}
.badge.blue{background:#e9f2ff;color:var(--blue)}
.badge.green{background:var(--greenbg);color:var(--green)}
.badge.amber{background:var(--amberbg);color:var(--amber)}
.badge.red{background:var(--redbg);color:var(--red)}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-bottom:10px}
.item:last-child{margin-bottom:0}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:#fff;color:#53677a;border-radius:10px;padding:10px 13px;font-weight:750}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.notice{padding:13px 15px;border-radius:13px;background:var(--soft);color:var(--blue2);font-size:13px;line-height:1.55}
.success{padding:13px 15px;border-radius:13px;background:var(--greenbg);color:var(--green);font-size:13px}
.warning{padding:13px 15px;border-radius:13px;background:var(--amberbg);color:var(--amber);font-size:13px}
.location-box{border:1px solid var(--line);border-radius:15px;padding:15px;background:#f9fbfd}
.location-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}
.dot.green{background:#20855a}
.dot.red{background:#c33d3d}
.dot.amber{background:#b97918}
.modal{position:fixed;inset:0;background:rgba(18,59,112,.25);display:grid;place-items:center;padding:20px;z-index:100}
.modal-card{background:#fff;border-radius:22px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{border:0;background:#f1f5f9;border-radius:10px;padding:8px 11px}
.load-slot{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.employee-card{border:1px solid var(--line);padding:14px;border-radius:14px}
.form-section{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}
.form-section h3{margin:0 0 5px}
.form-section p{margin:0 0 12px;color:var(--muted);font-size:13px}
.camera-wrap{background:#111;border-radius:16px;overflow:hidden}
.camera-wrap video{display:block;width:100%;max-height:360px;object-fit:cover}
.capture-preview{width:100%;max-height:250px;object-fit:contain;border-radius:12px;background:#f1f5f9}
.share-box{display:flex;gap:8px}
.share-box input{flex:1}
@media(max-width:1050px){
.sidebar{transform:translateX(-100%);transition:.2s}
.sidebar.open{transform:none}
.main{margin-left:0;width:100%}
.mobile-menu{display:block!important}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
.content{padding:18px}
.topbar{padding:0 15px}
.stats,.two,.three{grid-template-columns:1fr}
.load-slot{grid-template-columns:1fr}
.head{flex-direction:column}
.share-box{flex-direction:column}
}
.mobile-menu{display:none;border:0;background:transparent;font-size:22px}
.toast{position:fixed;right:22px;bottom:22px;z-index:150;background:#123b70;color:#fff;padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);max-width:380px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f7fbff,#e9f3fc)}
.auth-card{width:min(450px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--shadow)}
</style>
</head>

<body>

<div id="auth" class="auth">
<div class="auth-card">
<div class="brand">AWSZ <span>DOOH Admin</span></div>
<h1>Admin Portal</h1>
<p class="muted">Digital Out-of-Home Advertising Network</p>
<form id="loginForm">
<div class="field">
<label>Email</label>
<input id="loginEmail" type="email" placeholder="admin@example.com" required>
</div>
<div class="field">
<label>Password</label>
<input id="loginPassword" type="password" placeholder="••••••••" required>
</div>
<button class="btn btn-primary" style="width:100%">Sign in</button>
<div id="loginError" class="small" style="color:var(--red);margin-top:10px"></div>
</form>
</div>
</div>

<div id="app" class="app hidden">

<aside id="sidebar" class="sidebar">
<div class="side-brand">
<div class="brand">AWSZ</div>
<div class="small muted">DOOH Admin Portal</div>
</div>

<nav class="nav">
<button data-page="dashboard" onclick="go('dashboard')">⌂ &nbsp; Dashboard</button>
<button data-page="areas" onclick="go('areas')">⌖ &nbsp; Areas & Locations</button>
<button data-page="shops" onclick="go('shops')">▣ &nbsp; Shops / Vendors</button>
<button data-page="clients" onclick="go('clients')">◯ &nbsp; Clients</button>
<button data-page="packages" onclick="go('packages')">▤ &nbsp; Packages</button>
<button data-page="ads" onclick="go('ads')">▶ &nbsp; Ads & Verification</button>
<button data-page="upcoming" onclick="go('upcoming')">◷ &nbsp; Upcoming Ads</button>
<button data-page="monitoring" onclick="go('monitoring')">● &nbsp; Screen Monitoring</button>
<button data-page="withdrawals" onclick="go('withdrawals')">$ &nbsp; Withdrawals</button>
<button data-page="complaints" onclick="go('complaints')">! &nbsp; Complaints</button>
<button data-page="employees" onclick="go('employees')">♙ &nbsp; Employees</button>
<button data-page="forms" onclick="go('forms')">☷ &nbsp; Form Builder</button>
<button data-page="settings" onclick="go('settings')">⚙ &nbsp; Settings</button>
</nav>

<div class="side-bottom">
<button class="btn btn-soft" style="width:100%" onclick="logout()">Sign out</button>
</div>
</aside>

<main class="main">

<header class="topbar">
<div class="top-left">
<button class="mobile-menu" onclick="toggleSidebar()">☰</button>
<div id="crumb" class="crumb">Dashboard</div>
</div>
<div class="top-actions">
<span class="badge blue">AWSZ TEAM</span>
</div>
</header>

<div id="content" class="content"></div>

</main>
</div>

<div id="modal" class="modal hidden">
<div class="modal-card" id="modalBody"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
"use strict";

],

{id:"ad1",client:"c1",company:"Fresh Foods",package:"pkg1",mediaType:"Video",file:"fresh-foods.mp4",duration:30,status:"Pending",areas:["a2"],start:"2026-10-01T09:00",end:"2026-10-30T23:00",created:new Date().toISOString()}

{key:"owner",label:"Owner / Representative Name",required:true,enabled:true},
{key:"phone",label:"Phone / Registered Number",required:true,enabled:true},

{key:"installment",label:"LCD Installment",required:true,enabled:true},
{key:"subMeter",label:"Sub-Meter",required:false,enabled:true},

}
};

function loadDB(){
try{
const x=JSON.parse(localStorage.getItem(STORE));
return x||structuredClone(defaults);
}catch(e){return structuredClone(defaults)}
}

let db=loadDB();

function saveDB(){
localStorage.setItem(STORE,JSON.stringify(db));
}

function uid(prefix="id"){
return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

/* =========================================================
   BASIC UI
========================================================= */

const $=id=>document.getElementById(id);

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

function toast(title,msg=""){
$("toast").innerHTML="<strong>"+esc(title)+"</strong>"+(msg?'<div style="margin-top:4px">'+esc(msg)+"</div>":"");
$("toast").classList.remove("hidden");
clearTimeout(window.__toast);
window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),3500);
}

function badge(status){
let s=String(status||"").toLowerCase();
let c=s.includes("active")||s.includes("online")||s.includes("approved")||s.includes("paid")||s.includes("published")?"green":
s.includes("pending")||s.includes("late")||s.includes("correction")?"amber":
s.includes("offline")||s.includes("declined")||s.includes("rejected")?"red":"blue";
return '<span class="badge '+c+'">'+esc(status||"—")+"</span>";
}

function go(page){
window.currentPage=page;
$("sidebar").classList.remove("open");
render();
}

function toggleSidebar(){
$("sidebar").classList.toggle("open");
}

function openModal(html){
$("modalBody").innerHTML=html;
$("modal").classList.remove("hidden");
}

function closeModal(){
stopCamera();
$("modal").classList.add("hidden");
}

$("modal").addEventListener("click",e=>{
if(e.target.id==="modal")closeModal();
});

/* =========================================================
   LOGIN
========================================================= */

$("loginForm").addEventListener("submit",e=>{
e.preventDefault();
$("auth").classList.add("hidden");
$("app").classList.remove("hidden");
localStorage.setItem("awsz_admin_logged","1");
go("dashboard");
});

function logout(){
localStorage.removeItem("awsz_admin_logged");
$("app").classList.add("hidden");
$("auth").classList.remove("hidden");
}

if(localStorage.getItem("awsz_admin_logged")){
$("auth").classList.add("hidden");
$("app").classList.remove("hidden");
}

/* =========================================================
   DASHBOARD
========================================================= */

function shopStatus(shop){
if(shop.lcdStatus==="Offline")return"Offline";

const now=new Date();
const parts=String(shop.opening||"09:00").split(":");
const open=new Date();
open.setHours(Number(parts[0]),Number(parts[1]),0,0);

const last=shop.lastOnline?new Date(shop.lastOnline):null;

if(!last)return"Offline";

const diff=(last-open)/60000;

if(diff>15)return"Late";
return"Active";
}

function renderDashboard(){

const statuses=db.shops.map(shopStatus);
const online=statuses.filter(x=>x==="Active").length;
const offline=statuses.filter(x=>x==="Offline").length;
const late=statuses.filter(x=>x==="Late").length;

const today=new Date().toISOString().slice(0,10);

const todayWithdrawals=db.withdrawals.filter(w=>String(w.requested||"").slice(0,10)===today);
const todayIncome=Number(localStorage.getItem("awsz_today_income")||0);
const newVendors=db.shops.filter(s=>String(s.id).includes("_")||String(s.created||"").slice(0,10)===today).length;

$("crumb").textContent="Dashboard";

$("content").innerHTML=`
<div class="head">
<div>
<h1>Dashboard</h1>
<p>DOOH network overview and today's operations.</p>
</div>
</div>

<div class="grid stats">
<div class="card"><div class="stat-label">Total Shops</div><div class="stat-value">${db.shops.length}</div></div>
<div class="card"><div class="stat-label">Online / Active</div><div class="stat-value">${online}</div>${badge("Active")}</div>
<div class="card"><div class="stat-label">Offline</div><div class="stat-value">${offline}</div>${badge("Offline")}</div>
<div class="card"><div class="stat-label">Late</div><div class="stat-value">${late}</div>${badge("Late")}</div>
<div class="card"><div class="stat-label">Today's Withdrawals</div><div class="stat-value">${todayWithdrawals.length}</div></div>
<div class="card"><div class="stat-label">Today's Income</div><div class="stat-value">Rs ${todayIncome.toLocaleString()}</div></div>
<div class="card"><div class="stat-label">New Vendors</div><div class="stat-value">${newVendors}</div></div>
<div class="card"><div class="stat-label">Pending Approvals</div><div class="stat-value">${db.ads.filter(a=>a.status==="Pending").length}</div></div>
</div>

<div class="grid two" style="margin-top:18px">

<div class="card">
<div class="row between">
<h3 style="margin:0">Screen Status</h3>
<button class="btn btn-soft btn-small" onclick="go('monitoring')">View All</button>
</div>
<div style="margin-top:14px">
${db.shops.map(s=>`
<div class="item">
<div class="row between">
<strong>${esc(s.shopName)}</strong>
${badge(shopStatus(s))}
</div>
<div class="small muted" style="margin-top:5px">${esc(s.address)}</div>
</div>`).join("")}
</div>
</div>

<div class="card">
<h3 style="margin-top:0">Quick Actions</h3>
<div class="grid">
<button class="btn btn-primary" onclick="go('shops');setTimeout(()=>openShopForm(),100)">+ Add Shop / Vendor</button>
<button class="btn btn-soft" onclick="go('areas')">Manage Areas</button>
<button class="btn btn-soft" onclick="go('packages')">Create Package</button>
<button class="btn btn-soft" onclick="go('ads')">Review Ads</button>
<button class="btn btn-soft" onclick="go('withdrawals')">Verify Withdrawals</button>
</div>
</div>

</div>
`;
}

/* =========================================================
   AREAS
========================================================= */

function areaName(id){
return db.areas.find(a=>a.id===id)?.name||"—";
}

function renderAreas(){

$("crumb").textContent="Areas & Locations";

$("content").innerHTML=`
<div class="head">
<div>
<h1>Areas & Locations</h1>
<p>Create Area, Block, Sector, Phase, Precinct and custom geographic levels.</p>
</div>
<button class="btn btn-primary" onclick="openAreaForm()">+ Add New</button>
</div>

<div class="card">
<div class="table-wrap">
<table class="table">
<thead><tr>
<th>Name</th><th>Type</th><th>Parent</th><th>Actions</th>
</tr></thead>
<tbody>
${db.areas.map(a=>`
<tr>
<td><strong>${esc(a.name)}</strong></td>
<td>${badge(a.type)}</td>
<td>${esc(areaName(a.parent))}</td>
<td>
<button class="btn btn-soft btn-small" onclick="openAreaForm('${a.id}')">Edit</button>
<button class="btn btn-danger btn-small" onclick="deleteArea('${a.id}')">Delete</button>
</td>
</tr>`).join("")}
</tbody>
</table>
</div>
</div>
`;
}

function openAreaForm(id=""){
const a=db.areas.find(x=>x.id===id)||{};
openModal(`
<div class="modal-head">
<h3>${id?"Edit":"Add"} Location</h3>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div class="field">
<label>Location Name</label>
<input id="areaName" value="${esc(a.name)}" placeholder="e.g. DHA Block 3">
</div>

<div class="field">
<label>Area Type</label>

   LIVE LOCATION
========================================================= */

let locationWatch=null;
let currentLocation=null;

function requestLiveLocation(){

if(!navigator.geolocation){
$("locationStatus").innerHTML='<span class="dot red"></span> Geolocation is not supported on this device.';
return;
}

$("locationStatus").innerHTML='<span class="dot amber"></span> Requesting live location permission...';

navigator.geolocation.getCurrentPosition(
pos=>{
currentLocation={
lat:Number(pos.coords.latitude.toFixed(7)),
lng:Number(pos.coords.longitude.toFixed(7)),
accuracy:Math.round(pos.coords.accuracy),
at:new Date().toISOString()
};

$("locationStatus").innerHTML=
'<span class="dot green"></span> Live location captured — Accuracy ±'+currentLocation.accuracy+'m';

$("liveLat").value=currentLocation.lat;
$("liveLng").value=currentLocation.lng;
$("liveAccuracy").value=currentLocation.accuracy;
$("liveLocationAt").value=currentLocation.at;

startLocationWatch();
},
err=>{
$("locationStatus").innerHTML=
'<span class="dot red"></span> Location permission was not granted. Vendor must allow location access.';
},
{enableHighAccuracy:true,timeout:15000,maximumAge:0}
);
}

function startLocationWatch(){

if(locationWatch)navigator.geolocation.clearWatch(locationWatch);

locationWatch=navigator.geolocation.watchPosition(
pos=>{
currentLocation={
lat:Number(pos.coords.latitude.toFixed(7)),
lng:Number(pos.coords.longitude.toFixed(7)),
accuracy:Math.round(pos.coords.accuracy),
at:new Date().toISOString()
};

if($("liveLat")){
$("liveLat").value=currentLocation.lat;
$("liveLng").value=currentLocation.lng;
$("liveAccuracy").value=currentLocation.accuracy;
$("liveLocationAt").value=currentLocation.at;
$("locationStatus").innerHTML=
'<span class="dot green"></span> Live location updating — Accuracy ±'+currentLocation.accuracy+'m';
}
},
()=>{},
{enableHighAccuracy:true,maximumAge:5000,timeout:20000}
);
}

========================================================= */

function loadSlotsHTML(slots=[]){

if(!slots.length)slots=[{start:"",end:""}];

return `
<div id="loadSlots">
${slots.map((s,i)=>`
<div class="load-slot" data-slot="${i}">
<div class="field" style="margin:0">
<label>Start</label>
<input class="ls-start" type="time" value="${esc(s.start||"")}">
</div>
<div class="field" style="margin:0">
<label>End</label>
<input class="ls-end" type="time" value="${esc(s.end||"")}">
</div>
<button class="btn btn-danger btn-small" type="button" onclick="removeLoadSlot(this)">Remove</button>
</div>
`).join("")}
</div>
<button class="btn btn-soft btn-small" type="button" onclick="addLoadSlot()">+ Add Load-Shedding Slot</button>
`;
}

function addLoadSlot(){
const box=$("loadSlots");
const div=document.createElement("div");
div.className="load-slot";
div.innerHTML=`
<div class="field" style="margin:0">
<label>Start</label><input class="ls-start" type="time">
</div>
<div class="field" style="margin:0">
<label>End</label><input class="ls-end" type="time">
</div>
<button class="btn btn-danger btn-small" type="button" onclick="removeLoadSlot(this)">Remove</button>
`;
box.appendChild(div);
}

function removeLoadSlot(btn){
const rows=[...document.querySelectorAll("#loadSlots .load-slot")];
if(rows.length<=1){
btn.closest(".load-slot").querySelector(".ls-start").value="";
btn.closest(".load-slot").querySelector(".ls-end").value="";
return;
}
btn.closest(".load-slot").remove();
}

function collectLoadSlots(){
return [...document.querySelectorAll("#loadSlots .load-slot")]
.map(row=>({
start:row.querySelector(".ls-start")?.value||"",
end:row.querySelector(".ls-end")?.value||""
}))
.filter(x=>x.start&&x.end);
}

function loadClientPackage(){
const c=db.clients.find(x=>x.id===$("adClient").value);
if(c&&$("adPackage"))$("adPackage").value=c.package||"";
updateAdRules();
}

function updateAdRules(){
const p=db.packages.find(x=>x.id===$("adPackage")?.value);
if(p&&$("adValidation")){
$("adValidation").innerHTML=
p.media==="Video"
?`Package requires exactly <strong>${p.duration} seconds</strong> video.`
:`Poster package requires at least <strong>${p.minWidth} × ${p.minHeight}px</strong>.`;
}
}

function validateAdFile(){

const file=$("adFile").files[0];
const pkg=db.packages.find(p=>p.id===$("adPackage").value);

if(!file||!pkg)return;

if(pkg.media==="Video"){

const video=document.createElement("video");
video.preload="metadata";

video.onloadedmetadata=()=>{
const duration=Math.round(video.duration);

if(duration!==Number(pkg.duration)){
$("adValidation").innerHTML=
`<div class="warning"><strong>Invalid video.</strong> Package requires ${pkg.duration}s but uploaded video is ${duration}s.</div>`;
$("adFile").dataset.valid="0";
}else{
$("adValidation").innerHTML=
`<div class="success"><strong>Valid video.</strong> Duration matches ${pkg.duration}s package.</div>`;
$("adFile").dataset.valid="1";
$("adFile").dataset.duration=duration;
}
URL.revokeObjectURL(video.src);
};

video.src=URL.createObjectURL(file);

}else{

const img=new Image();

img.onload=()=>{
const valid=img.naturalWidth>=Number(pkg.minWidth||0)&&img.naturalHeight>=Number(pkg.minHeight||0);

if(!valid){
$("adValidation").innerHTML=
`<div class="warning"><strong>Invalid poster.</strong> Uploaded ${img.naturalWidth}×${img.naturalHeight}px. Required minimum ${pkg.minWidth}×${pkg.minHeight}px.</div>`;
$("adFile").dataset.valid="0";
}else{
$("adValidation").innerHTML=
`<div class="success"><strong>Valid poster.</strong> ${img.naturalWidth}×${img.naturalHeight}px.</div>`;
$("adFile").dataset.valid="1";
}
};

img.src=URL.createObjectURL(file);
}
}

function validateAndSaveAd(){

const file=$("adFile").files[0];
if(!file)return alert("Upload media first.");
if($("adFile").dataset.valid!=="1")return alert("Media does not pass package validation.");

const c=db.clients.find(x=>x.id===$("adClient").value);
const pkg=db.packages.find(x=>x.id===$("adPackage").value);

if(!c||!pkg)return alert("Select client and package.");

const ad={
id:uid("ad"),
client:c.id,
company:c.company,
package:pkg.id,
mediaType:pkg.media,
file:file.name,
duration:Number($("adFile").dataset.duration||pkg.duration),
validation:"Valid",
status:"Pending",
areas:[...$("adAreas").selectedOptions].map(o=>o.value),
start:$("adStart").value,
end:$("adEnd").value,
created:new Date().toISOString()
};

db.ads.push(ad);
saveDB();
closeModal();
render();
toast("Ad Submitted","Media passed validation and entered approval queue.");
}

function approveAd(id){
const a=db.ads.find(x=>x.id===id);

a.status="Approved";

<div class="modal-head"><h3>${esc(s.shopName)}</h3><button class="close" onclick="closeModal()">✕</button></div>

<div class="grid two">
<div class="card" style="box-shadow:none">
<strong>Current Status</strong>
<div style="margin-top:10px">${badge(shopStatus(s))}</div>
</div>
<div class="card" style="box-shadow:none">
<strong>LCD</strong>
<div style="margin-top:10px">${badge(s.lcdStatus)}</div>
</div>
</div>

<div class="kv" style="display:grid;grid-template-columns:160px 1fr;gap:8px;margin-top:15px">
<div>Opening</div><div>${esc(s.opening)}</div>
<div>Closing</div><div>${esc(s.closing)}</div>
<div>Last Online</div><div>${s.lastOnline?new Date(s.lastOnline).toLocaleString():"—"}</div>
<div>GPS</div><div>${s.liveLat+", "+s.liveLng}</div>
<div>Accuracy</div><div>±${s.locationAccuracy||"—"}m</div>
<div>Internet</div><div>${esc(s.internet)}</div>
</div>

<div class="row" style="justify-content:flex-end;margin-top:18px">
<button class="btn btn-soft" onclick="simulateOffline('${id}')">Toggle Offline</button>
<button class="btn btn-green" onclick="simulateOnline('${id}')">Set Online Now</button>
</div>
`);
}

function simulateOffline(id){
const s=db.shops.find(x=>x.id===id);
if(!s)return;
s.lcdStatus="Offline";
s.lastOnline=new Date(Date.now()-3600000).toISOString();
saveDB();
closeModal();
render();
}

function simulateOnline(id){
const s=db.shops.find(x=>x.id===id);
if(!s)return;
s.lcdStatus="Online";
s.lastOnline=new Date().toISOString();
saveDB();
closeModal();
render();
}

   WITHDRAWALS
========================================================= */

let paymentCamera=null;
let capturedVendorPhoto="";
let paymentScreenshot="";

function renderWithdrawals(){

$("crumb").textContent="Withdrawals";

$("content").innerHTML=`
<div class="head">
<div><h1>Vendor Withdrawals</h1><p>Payment remains Pending until payment verification evidence is completed.</p></div>
</div>

<div class="card">
<div class="table-wrap">
<table class="table">
<thead><tr><th>Vendor</th><th>Amount</th><th>Bank</th><th>Account</th><th>Status</th><th>Requested</th><th>Action</th></tr></thead>
<tbody>
${db.withdrawals.map(w=>`
<tr>
<td><strong>${esc(w.vendor)}</strong></td>
<td>Rs ${Number(w.amount).toLocaleString()}</td>
<td>${esc(w.bank)}</td>
<td>${esc(w.account)}</td>
<td>${badge(w.status)}</td>
<td>${new Date(w.requested).toLocaleString()}</td>
<td>
${w.status==="Pending"?`<button class="btn btn-primary btn-small" onclick="openPaymentVerification('${w.id}')">Verify Payment</button>`:`<button class="btn btn-soft btn-small" onclick="viewPaymentHistory('${w.id}')">History</button>`}
</td>

</tbody>

</div>

async function openPaymentVerification(id){

capturedVendorPhoto="";
paymentScreenshot="";

const w=db.withdrawals.find(x=>x.id===id);

openModal(`
<div class="modal-head">
<div>
<h3>Payment Verification</h3>
<div class="small muted">${esc(w.vendor)} · Rs ${Number(w.amount).toLocaleString()}</div>
</div>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div class="notice">
Payment can only move from <strong>Pending → Paid</strong> after the payment staff member is selected, vendor webcam photo is captured, and payment screenshot is attached.
</div>

<div class="field">
<label>Paid By / Staff Member</label>
<select id="paidBy">
<option value="">Select staff member</option>
${db.employees.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.role)}</option>`).join("")}
</select>
</div>

<div class="form-section">
<h3>1. Vendor Webcam Photo</h3>
<p>Open webcam and capture the vendor photo.</p>

<div class="camera-wrap">
<video id="paymentVideo" autoplay playsinline></video>
</div>

<div class="row wrap" style="margin-top:10px">
<button class="btn btn-primary" onclick="startPaymentCamera()">Open Webcam</button>
<button class="btn btn-soft" onclick="captureVendorPhoto()">Capture Photo</button>
</div>

<canvas id="paymentCanvas" class="hidden"></canvas>
<img id="vendorPhotoPreview" class="capture-preview hidden" style="margin-top:12px">
</div>

<div class="form-section">
<h3>2. Payment Screenshot</h3>
<p>Attach bank/payment proof screenshot.</p>
<input id="paymentScreenshotFile" type="file" accept="image/*" onchange="loadPaymentScreenshot(event)">
<img id="paymentScreenshotPreview" class="capture-preview hidden" style="margin-top:12px">
</div>

<div class="form-section">
<h3>3. Payment Reference</h3>
<input id="paymentReference" placeholder="Transaction ID / payment reference">
</div>

<div class="row" style="justify-content:flex-end;margin-top:20px">
<button class="btn btn-soft" onclick="closeModal()">Cancel</button>
<button id="markPaidBtn" class="btn btn-green" disabled onclick="completePaymentVerification('${id}')">Mark as Paid</button>
</div>
`);

startPaymentCamera();
}

async function startPaymentCamera(){

try{

if(!navigator.mediaDevices?.getUserMedia){
alert("Camera is not available in this browser.");
return;
}

paymentCamera=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"},
audio:false
});

const video=$("paymentVideo");
if(video)video.srcObject=paymentCamera;

}catch(e){
alert("Camera permission was not granted. Please allow camera access.");
}
}

function captureVendorPhoto(){

const video=$("paymentVideo");
const canvas=$("paymentCanvas");

if(!video||!video.videoWidth){
alert("Open the webcam first.");
return;
}

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0,canvas.width,canvas.height);

capturedVendorPhoto=canvas.toDataURL("image/jpeg",.82);

$("vendorPhotoPreview").src=capturedVendorPhoto;
$("vendorPhotoPreview").classList.remove("hidden");

updatePaymentButton();
}

function loadPaymentScreenshot(e){

const file=e.target.files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=()=>{
paymentScreenshot=reader.result;
$("paymentScreenshotPreview").src=paymentScreenshot;
$("paymentScreenshotPreview").classList.remove("hidden");
updatePaymentButton();
};

reader.readAsDataURL(file);
}

function updatePaymentButton(){

const ok=Boolean(
$("paidBy")?.value &&
capturedVendorPhoto &&
paymentScreenshot
);

if($("markPaidBtn"))$("markPaidBtn").disabled=!ok;
}

function completePaymentVerification(id){

updatePaymentButton();

if(!$("paidBy").value||!capturedVendorPhoto||!paymentScreenshot){
alert("All verification steps are required.");
return;
}

const w=db.withdrawals.find(x=>x.id===id);
const emp=db.employees.find(x=>x.id===$("paidBy").value);

w.status="Paid";
w.paidBy=emp.name;
w.paidAt=new Date().toISOString();
w.paymentReference=$("paymentReference").value.trim();
w.vendorPhoto=capturedVendorPhoto;
w.paymentScreenshot=paymentScreenshot;

w.history=w.history||[];
w.history.push({
status:"Paid",
paidBy:emp.name,
paidAt:w.paidAt,
paymentReference:w.paymentReference
});

saveDB();

closeModal();
render();
toast("Payment Verified","Withdrawal is now marked Paid.");
}

function stopCamera(){

if(paymentCamera){
paymentCamera.getTracks().forEach(t=>t.stop());
paymentCamera=null;
}
}

function viewPaymentHistory(id){

const w=db.withdrawals.find(x=>x.id===id);

openModal(`
<div class="modal-head"><h3>Payment History</h3><button class="close" onclick="closeModal()">✕</button></div>

<div class="kv" style="display:grid;grid-template-columns:160px 1fr;gap:8px">
<div>Vendor</div><div>${esc(w.vendor)}</div>
<div>Amount</div><div>Rs ${Number(w.amount).toLocaleString()}</div>
<div>Status</div><div>${badge(w.status)}</div>
<div>Paid By</div><div>${esc(w.paidBy||"—")}</div>
<div>Paid At</div><div>${w.paidAt?new Date(w.paidAt).toLocaleString():"—"}</div>
<div>Reference</div><div>${esc(w.paymentReference||"—")}</div>
</div>

${w.vendorPhoto?`
<div class="form-section">
<h3>Vendor Photo</h3>
<img class="capture-preview" src="${w.vendorPhoto}">
</div>`:""}

${w.paymentScreenshot?`
<div class="form-section">
<h3>Payment Screenshot</h3>
<img class="capture-preview" src="${w.paymentScreenshot}">
</div>`:""}

<div class="form-section">
<h3>Audit History</h3>
${(w.history||[]).map(h=>`
<div class="item">
<strong>${esc(h.status)}</strong>
<div class="small muted">${esc(h.paidBy||"")} · ${h.paidAt?new Date(h.paidAt).toLocaleString():""}</div>
<div>${esc(h.paymentReference||"")}</div>
</div>
`).join("")||'<div class="empty">No history.</div>'}
</div>
`);
}

function saveComplaint(){

id:uid("complaint"),
from:$("coFrom").value.trim(),
subject:$("coSubject").value.trim(),
message:$("coMessage").value.trim(),
status:$("coStatus").value,

});

   FORM BUILDER
========================================================= */

function renderForms(){

$("crumb").textContent="Form Builder";

$("content").innerHTML=`
<div class="head">
<div><h1>Form Builder</h1><p>Customize Shop / Vendor onboarding fields without changing the rest of the portal.</p></div>
<button class="btn btn-primary" onclick="addCustomField()">+ Add Custom Field</button>
</div>

<div class="card">
<h3 style="margin-top:0">Shop / Vendor Form Fields</h3>
<div class="small muted" style="margin-bottom:15px">
Enabled fields appear in both admin onboarding and the vendor shared form.
</div>

${db.formFields.shop.map((f,i)=>`
<div class="item">
<div class="row between wrap">
<div>
<strong>${esc(f.label)}</strong>
<div class="small muted">${esc(f.key)}</div>
</div>
<div class="row">
<label class="row small"><input type="checkbox" ${f.enabled?"checked":""} onchange="toggleFormField(${i},this.checked)"> Enabled</label>
<label class="row small"><input type="checkbox" ${f.required?"checked":""} onchange="toggleRequiredField(${i},this.checked)"> Required</label>
<button class="btn btn-soft btn-small" onclick="renameFormField(${i})">Rename</button>
${!["shopName","owner","phone","category","address","liveLocation"].includes(f.key)?`<button class="btn btn-danger btn-small" onclick="deleteFormField(${i})">Delete</button>`:""}
</div>
</div>
</div>
`).join("")}
</div>
`;
}

function toggleFormField(i,v){
db.formFields.shop[i].enabled=v;
saveDB();
render();
}

function toggleRequiredField(i,v){
db.formFields.shop[i].required=v;
saveDB();
render();
}

function renameFormField(i){
const n=prompt("New field label:",db.formFields.shop[i].label);
if(!n?.trim())return;
db.formFields.shop[i].label=n.trim();
saveDB();
render();
}

function addCustomField(){
const label=prompt("Custom field name:");
if(!label?.trim())return;

db.formFields.shop.push({
key:"custom_"+uid("field"),
label:label.trim(),
required:false,
enabled:true
});

saveDB();
render();
toast("Custom Field Added","The field is now visible in the onboarding form.");
}

function deleteFormField(i){
if(!confirm("Delete this custom field?"))return;
db.formFields.shop.splice(i,1);
saveDB();
render();
}

/* =========================================================
   ROUTER
========================================================= */

function render(){

if(isVendorMode()){
renderVendorForm();
return;
}

const pages={
dashboard:renderDashboard,
areas:renderAreas,
shops:renderShops,
clients:renderClients,
packages:renderPackages,
ads:renderAds,
upcoming:renderUpcoming,
monitoring:renderMonitoring,
withdrawals:renderWithdrawals,
complaints:renderComplaints,
employees:renderEmployees,
forms:renderForms,
settings:renderSettings
};

const names={
dashboard:"Dashboard",
areas:"Areas & Locations",
shops:"Shops / Vendors",
clients:"Clients",
packages:"Packages",
ads:"Ads & Verification",
upcoming:"Upcoming Ads",
monitoring:"Screen Monitoring",
withdrawals:"Withdrawals",
complaints:"Complaints",
employees:"Employees",
forms:"Form Builder",
settings:"Settings"
};

if(!window.currentPage)window.currentPage="dashboard";

$("crumb").textContent=names[window.currentPage]||"Dashboard";

document.querySelectorAll(".nav button").forEach(b=>{
b.classList.toggle("active",b.dataset.page===window.currentPage);
});

(pages[window.currentPage]||renderDashboard)();
}

/* =========================================================
   START
========================================================= */

if(isVendorMode()){
renderVendorForm();
}else{
render();
}

/* Keep local admin screen updated while staying on the page */
setInterval(()=>{
if(!isVendorMode()&&window.currentPage==="monitoring"){
renderMonitoring();
}
},30000);

</script>
