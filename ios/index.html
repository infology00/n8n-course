<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spotly Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
  --yellow:#f5c400;
  --yellow2:#ffd84d;
  --yellow3:#fff3b5;
  --bg:#f6f6f4;
  --white:#fff;
  --text:#202020;
  --muted:#777;
  --border:#e7e7e2;
  --green:#17823b;
  --green-bg:#e7f6ec;
  --red:#c93636;
  --red-bg:#fdeaea;
  --orange:#b87900;
  --orange-bg:#fff3d6;
  --grey:#777;
  --grey-bg:#eeeeec;
  --shadow:0 8px 30px rgba(0,0,0,.07);
}
body{
  margin:0;
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:var(--bg);
}
.login-card{
  width:100%;
  max-width:410px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  padding:34px;
  box-shadow:var(--shadow);
}
.logo{
  width:54px;
  height:54px;
  border-radius:16px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:24px;
  margin-bottom:18px;
}
.login-card h1{
  margin:0 0 7px;
  font-size:27px;
}
.login-card p{
  margin:0 0 25px;
  color:var(--muted);
}
.field{
  margin-bottom:15px;
}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}
.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--yellow);
  box-shadow:0 0 0 3px rgba(245,196,0,.15);
}
.primary-btn{
  border:0;
  background:var(--yellow);
  color:#171717;
  border-radius:10px;
  padding:12px 18px;
  font-weight:800;
}
.primary-btn:hover{background:var(--yellow2)}
.full{width:100%}

/* APP */
.app{
  min-height:100vh;
  display:flex;
}
.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid var(--border);
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  padding:20px 14px;
  z-index:50;
  overflow-y:auto;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 8px 22px;
}
.brand-mark{
  width:38px;
  height:38px;
  border-radius:11px;
  background:var(--yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
.brand-name{
  font-size:18px;
  font-weight:900;
}
.nav-section{
  margin:13px 8px 7px;
  color:#aaa;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:10px 11px;
  border-radius:9px;
  color:#444;
  margin-bottom:3px;
  font-weight:600;
}
.nav-btn:hover{background:#faf6df}
.nav-btn.active{
  background:var(--yellow3);
  color:#111;
  font-weight:800;
}
.sidebar-bottom{
  margin-top:18px;
  border-top:1px solid var(--border);
  padding-top:14px;
}
.logout{
  color:var(--red);
}

/* MAIN */
.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
}
.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:30;
}
.page-title{
  font-size:21px;
  font-weight:900;
}
.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.icon-btn:hover{background:#fff9df}
.icon-btn svg{
  width:20px;
  height:20px;
}
.notification-badge{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#d93025;
  color:#fff;
  font-size:10px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}
.admin-label{
  font-size:13px;
  font-weight:700;
}
.content{
  padding:25px;
}

/* DASHBOARD */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:23px;
}
.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:19px;
}
.stat-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.stat-value{
  font-size:27px;
  font-weight:900;
  margin-top:8px;
}
.section-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
}
.section-head h2{
  font-size:16px;
  margin:0;
}
.small-muted{
  color:var(--muted);
  font-size:12px;
}

/* TOOLBAR */
.toolbar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}
.search{
  flex:1;
  min-width:220px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  background:#fff;
  outline:none;
}
.filter{
  border:1px solid var(--border);
  background:#fff;
  border-radius:10px;
  padding:10px 12px;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}
th{
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.4px;
  color:#888;
  padding:12px 10px;
  border-bottom:1px solid var(--border);
}
td{
  padding:13px 10px;
  border-bottom:1px solid #f0f0ed;
  font-size:13px;
  vertical-align:middle;
}
tr:last-child td{border-bottom:0}
.vendor-name{
  font-weight:800;
}
.vendor-sub{
  font-size:11px;
  color:#888;
  margin-top:3px;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
}
.badge.approved{background:var(--green-bg);color:var(--green)}
.badge.pending{background:var(--orange-bg);color:var(--orange)}
.badge.rejected{background:var(--red-bg);color:var(--red)}
.badge.online{background:var(--green-bg);color:var(--green)}
.badge.offline{background:var(--grey-bg);color:#555}
.actions{
  display:flex;
  align-items:center;
  gap:6px;
}
.action-btn{
  height:32px;
  min-width:32px;
  padding:0 8px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
}
.action-btn:hover{background:#fff8d9}
.action-btn.approve{
  background:var(--yellow);
  border-color:var(--yellow);
}
.action-btn.reject{
  color:var(--red);
}
.action-btn.edit{
  width:32px;
  padding:0;
}
.action-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal{
  width:100%;
  max-width:760px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.18);
}
.modal.small{max-width:470px}
.modal-head{
  position:sticky;
  top:0;
  background:#fff;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
}
.modal-head h3{
  margin:0;
  font-size:18px;
}
.close-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  font-size:19px;
}
.modal-body{padding:20px}
.modal-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:15px 20px;
  border-top:1px solid var(--border);
  background:#fff;
  position:sticky;
  bottom:0;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}
.info-section{
  margin-bottom:20px;
}
.info-title{
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  color:#999;
  margin-bottom:10px;
  letter-spacing:.6px;
}
.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.info-item{
  background:#fafaf8;
  border:1px solid #eeeeea;
  border-radius:9px;
  padding:10px;
}
.info-label{
  color:#999;
  font-size:10px;
  margin-bottom:4px;
}
.info-value{
  font-size:12px;
  font-weight:700;
  word-break:break-word;
}
.map-box{
  width:100%;
  height:260px;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:#eee;
}
.map-box iframe{
  width:100%;
  height:100%;
  border:0;
}

/* NOTIFICATIONS */
.notification-panel{
  position:fixed;
  top:62px;
  right:20px;
  width:390px;
  max-height:520px;
  overflow-y:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  z-index:90;
}
.notification-head{
  padding:15px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.notification-head strong{font-size:14px}
.notification-item{
  padding:13px 15px;
  border-bottom:1px solid #f0f0ed;
  cursor:pointer;
}
.notification-item:hover{background:#fffaf0}
.notification-item.unread{background:#fffbea}
.notification-item-title{
  font-weight:900;
  font-size:13px;
}
.notification-item-message{
  font-size:12px;
  color:#666;
  margin-top:4px;
  line-height:1.45;
}
.notification-item-meta{
  font-size:10px;
  color:#999;
  margin-top:7px;
}
.empty{
  text-align:center;
  color:#999;
  padding:35px 15px;
  font-size:13px;
}

/* TOAST */
.toast-wrap{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:300;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.toast{
  max-width:360px;
  background:#222;
  color:#fff;
  padding:12px 15px;
  border-radius:10px;
  font-size:12px;
  box-shadow:var(--shadow);
}

/* GENERIC */
.placeholder{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:40px;
  text-align:center;
}
.placeholder h2{
  margin:0 0 7px;
  font-size:20px;
}
.placeholder p{
  color:#888;
  margin:0;
}

/* MOBILE */
.mobile-menu{
  display:none;
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
}
@media(max-width:950px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }
  .sidebar.open{transform:translateX(0)}
  .main{
    margin-left:0;
    width:100%;
  }
  .mobile-menu{display:flex;align-items:center;justify-content:center}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .content{padding:15px}
  .topbar{padding:0 15px}
  .admin-label{display:none}
  .stats{grid-template-columns:1fr 1fr;gap:9px}
  .stat{padding:13px}
  .stat-value{font-size:21px}
  .grid2,.info-grid{grid-template-columns:1fr}
  .notification-panel{
    left:10px;
    right:10px;
    width:auto;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="logo">S</div>
    <h1>Spotly Admin</h1>
    <p>Sign in to manage vendors and network activity.</p>

    <div class="field">
      <label>Admin ID</label>
      <input id="adminEmail" type="email" value="admin@soptly.com" autocomplete="username">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="adminPassword" type="password" autocomplete="current-password">
    </div>

    <button id="loginBtn" class="primary-btn full" onclick="adminLogin()">
      Login
    </button>
  </div>
</div>

<!-- APP -->
<div id="adminApp" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-name">Spotly Admin</div>
    </div>

    <div class="nav-section">Main</div>

    <button class="nav-btn active" data-page="dashboard" onclick="goPage('dashboard')">
      Dashboard
    </button>

    <button class="nav-btn" data-page="vendors" onclick="goPage('vendors')">
      Vendors
    </button>

    <button class="nav-btn" data-page="notifications" onclick="goPage('notifications')">
      Notifications
    </button>

    <div class="nav-section">Advertising</div>

    <button class="nav-btn" data-page="packages" onclick="goPage('packages')">
      Packages
    </button>

    <button class="nav-btn" data-page="ads" onclick="goPage('ads')">
      Ads
    </button>

    <button class="nav-btn" data-page="upcoming" onclick="goPage('upcoming')">
      Upcoming Ads
    </button>

    <button class="nav-btn" data-page="monitoring" onclick="goPage('monitoring')">
      Screen Monitoring
    </button>

    <div class="nav-section">Management</div>

    <button class="nav-btn" data-page="withdrawals" onclick="goPage('withdrawals')">
      Withdrawals
    </button>

    <button class="nav-btn" data-page="complaints" onclick="goPage('complaints')">
      Complaints
    </button>

    <button class="nav-btn" data-page="formbuilder" onclick="goPage('formbuilder')">
      Form Builder
    </button>

    <button class="nav-btn" data-page="settings" onclick="goPage('settings')">
      Settings
    </button>

    <div class="sidebar-bottom">
      <button class="nav-btn logout" onclick="adminLogout()">Logout</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-actions">
        <button class="mobile-menu" onclick="toggleSidebar()" aria-label="Menu">
          ☰
        </button>
        <div id="pageTitle" class="page-title">Dashboard</div>
      </div>

      <div class="top-actions">
        <div class="admin-label">Main Admin</div>

        <button class="icon-btn" onclick="toggleNotificationPanel()" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>
          <span id="topNotificationBadge" class="notification-badge hidden">0</span>
        </button>
      </div>
    </header>

    <div id="notificationPanel" class="notification-panel hidden"></div>

    <section id="content" class="content"></section>

  </main>
</div>

<!-- VENDOR DETAIL -->
<div id="vendorDetailModal" class="modal-backdrop hidden">
  <div class="modal">

    <div class="modal-head">
      <h3 id="vendorDetailTitle">Vendor</h3>
      <button class="close-btn" onclick="closeModal('vendorDetailModal')">×</button>
    </div>

    <div id="vendorDetailBody" class="modal-body"></div>

    <div id="vendorDetailFoot" class="modal-foot"></div>

  </div>
</div>

<!-- EDIT VENDOR -->
<div id="editVendorModal" class="modal-backdrop hidden">
  <div class="modal">

    <div class="modal-head">
      <h3>Edit Vendor</h3>
      <button class="close-btn" onclick="closeModal('editVendorModal')">×</button>
    </div>

    <div class="modal-body">

      <input id="editVendorId" type="hidden">

      <div class="info-title">Personal</div>

      <div class="grid2">
        <div class="field">
          <label>Vendor Name</label>
          <input id="edit_vendor_name">
        </div>

        <div class="field">
          <label>Owner Name</label>
          <input id="edit_owner_name">
        </div>

        <div class="field">
          <label>Phone</label>
          <input id="edit_phone">
        </div>

        <div class="field">
          <label>Email</label>
          <input id="edit_email">
        </div>
      </div>

      <div class="info-title">Business & Location</div>

      <div class="grid2">
        <div class="field">
          <label>Category</label>
          <input id="edit_category">
        </div>

        <div class="field">
          <label>Area</label>
          <input id="edit_area">
        </div>

        <div class="field">
          <label>Phase</label>
          <input id="edit_phase">
        </div>

        <div class="field">
          <label>Precinct</label>
          <input id="edit_precinct">
        </div>

        <div class="field">
          <label>Sector</label>
          <input id="edit_sector">
        </div>

        <div class="field">
          <label>Block</label>
          <input id="edit_block">
        </div>
      </div>

      <div class="field">
        <label>Address</label>
        <textarea id="edit_address" rows="3"></textarea>
      </div>

      <div class="grid2">
        <div class="field">
          <label>Footfall</label>
          <input id="edit_footfall" type="number">
        </div>

        <div class="field">
          <label>Shop Size</label>
          <input id="edit_shop_size">
        </div>
      </div>

      <div class="info-title">LCD</div>

      <div class="grid2">
        <div class="field">
          <label>LCD Status</label>
          <select id="edit_lcd_status">
            <option value="">Select</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
          </select>
        </div>

        <div class="field">
          <label>Total LCD Price</label>
          <input id="edit_lcd_total_price" type="number">
        </div>

        <div class="field">
          <label>Down Payment</label>
          <input id="edit_lcd_down_payment" type="number">
        </div>

        <div class="field">
          <label>Monthly Installment</label>
          <input id="edit_lcd_monthly_installment" type="number">
        </div>

        <div class="field">
          <label>Installment Months</label>
          <input id="edit_lcd_installment_months" type="number">
        </div>

        <div class="field">
          <label>Online Status</label>
          <select id="edit_online_status">
            <option value="false">Offline</option>
            <option value="true">Online</option>
          </select>
        </div>
      </div>

      <div class="info-title">Internet</div>

      <div class="grid2">
        <div class="field">
          <label>Internet Status</label>
          <input id="edit_internet_status">
        </div>

        <div class="field">
          <label>Internet Provider</label>
          <input id="edit_internet_provider">
        </div>

        <div class="field">
          <label>Internet Company Required</label>
          <select id="edit_internet_company_required">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
      </div>

      <div class="info-title">Opening Hours</div>

      <div class="grid2">
        <div class="field">
          <label>Opening Time</label>
          <input id="edit_opening_time" type="time">
        </div>

        <div class="field">
          <label>Closing Time</label>
          <input id="edit_closing_time" type="time">
        </div>
      </div>

      <div class="field">
        <label>Ice Cream Fridge</label>
        <select id="edit_ice_cream_fridge">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>

      <div class="info-title">Bank</div>

      <div class="grid2">
        <div class="field">
          <label>Bank Name</label>
          <input id="edit_bank_name">
        </div>

        <div class="field">
          <label>Account Title</label>
          <input id="edit_account_title">
        </div>

        <div class="field">
          <label>Account Number</label>
          <input id="edit_account_number">
        </div>

        <div class="field">
          <label>IBAN</label>
          <input id="edit_iban">
        </div>

        <div class="field">
          <label>Payment Method</label>
          <input id="edit_payment_method">

function esc(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(message){
  const wrap = $("toastWrap");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  wrap.appendChild(el);

  setTimeout(()=>{

}

function formatDate(value){
  if(!value) return "—";

  const d = new Date(value);

  if(isNaN(d.getTime())) return value;

  return d.toLocaleString("en-GB",{
    day:"numeric",
    month:"short",
    year:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}

function todayKey(){
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

async function adminLogin(){

  const email =
    $("adminEmail").value.trim();

  const password =
    $("adminPassword").value;

  if(!email || !password){
    toast("Enter Admin ID and password.");
    return;
  }

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "Logging in...";

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      console.error(error);
      toast(error.message || "Login failed.");
      return;
    }

    if(!data || !data.user){
      toast("Admin login failed.");
      return;
    }

    const {
      data: admin,
      error: adminError
    } =
      await supabaseClient
        .from("admin_users")
        .select("*")
        .eq("user_id",data.user.id)
        .eq("active",true)
        .maybeSingle();

    if(adminError){
      console.error(adminError);
      await supabaseClient.auth.signOut();
      toast("Unable to verify admin account.");
      return;
    }

    if(!admin){
      await supabaseClient.auth.signOut();
      toast("This account is not an active admin.");
      return;
    }

    currentAdmin = {
      ...admin,
      authUser:data.user
    };

    showAdminApp();

    await loadAll();

    subscribeRealtime();

  }catch(error){

    console.error(error);
    toast("Login failed.");

  }finally{

    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Login";

  }
}

      data:{session}

async function loadAdminNotifications(){

    Admin notifications are stored separately.

      type text

      .from("admin_notifications")

  message,
  type = "system",
  vendorId = null
}){

  try{

    const {
      error
    } =
      await supabaseClient
        .from("admin_notifications")
        .insert({
          title,
          message,
          type,
          vendor_id:vendorId,
          is_read:false
        });

      console.error(
        "createAdminNotification:",
        error

      return false;

    return true;

    console.error(error);

    error
  } =
    await supabaseClient
      .from("admin_notifications")
      .update({
        is_read:true
      })
      .eq("id",id);

  if(error){
    console.error(error);
    return;
  }

  const n =
    adminNotifications.find(
      x => String(x.id) === String(id)
    );

  if(n){
    n.is_read = true;

  updateNotificationBadge();

  renderNotifications();

function updateNotificationBadge(){

  const unread =
    adminNotifications.filter(
      n => !n.is_read

    $("topNotificationBadge");

  if(unread > 0){

      unread > 99 ? "99+" : unread;

async function approveVendor(id){

  const vendor = getVendorById(id);

  if(!vendor){
    toast("Vendor not found.");
    return;
  }

  if(!vendor.id){
    toast("This vendor has no valid database ID.");
    return;
  }

  if(String(vendor.status).toLowerCase() === "approved"){
    toast("Vendor is already approved.");
    return;
  }

  const vendorName =
    vendor.vendor_name ||
    vendor.owner_name ||
    "this vendor";

  showConfirm(
    "Approve Vendor",
    `Approve ${vendorName}?`,
    async ()=>{

      try{

        const {
          data,
          error
        } =
          await supabaseClient
            .from("vendors")
            .update({
              status:"approved",
              updated_at:new Date().toISOString()
            })
            .eq("id",id)
            .select("*")
            .maybeSingle();

        if(error){

          console.error(
            "APPROVAL ERROR:",
            error
          );

          toast(
            error.message ||
            "Vendor approval failed."
          );

          return;
        }

        if(!data){

          toast(
            "Vendor was not updated. Check admin RLS."
          );

          return;
        }

        const index =
          vendors.findIndex(
            v => String(v.id) === String(id)
          );

        if(index !== -1){
          vendors[index] = data;
        }

        /*
          Vendor notification:
          ONLY vendor receives this.
        */

        await createVendorApprovalNotification(data);

        /*
          Admin notification:
          ONLY admin receives this.
        */

        await createAdminNotification({
          title:"Vendor Approved",
          message:`${vendorName} has been approved.`,
          type:"vendor_approved",
          vendorId:data.id
        });

        closeModal("confirmModal");
        closeModal("vendorDetailModal");

        renderCurrentPage();

        await loadAdminNotifications();

        updateNotificationBadge();

        toast("Vendor approved successfully.");

      }catch(error){

        console.error(error);
        toast(
          error.message ||
          "Vendor approval failed."
        );

      }

    }
  );
}

async function createVendorApprovalNotification(vendor){

  if(!vendor || !vendor.id){
    return;
  }

  /*
    Prevent duplicate approval notifications.

    We check existing unread/read approval notification
    for this vendor before inserting another one.
  */

  const {
    data:existing,
    error:existingError
  } =
    await supabaseClient
      .from("vendor_notifications")
      .select("id,title,created_at")
      .eq("vendor_id",vendor.id)
      .eq("title","Vendor Account Approved")
      .limit(1);

  if(existingError){

    console.error(
      "Vendor notification check:",
      existingError
    );

    return;
  }

  if(existing && existing.length){
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("vendor_notifications")
      .insert({
        vendor_id:vendor.id,
        title:"Vendor Account Approved",
        message:"Your Spotly vendor account has been approved by admin.",
        is_read:false
      });

  if(error){
    console.error(
      "Vendor approval notification:",
      error
    );
  }
}

async function saveVendor(){

  const id =
    $("editVendorId").value;

  if(!id){
    toast("Vendor ID missing.");
    return;
  }

  const payload = {

    vendor_name:$("edit_vendor_name").value.trim(),
    owner_name:$("edit_owner_name").value.trim(),
    phone:$("edit_phone").value.trim(),
    email:$("edit_email").value.trim(),

    category:$("edit_category").value.trim(),
    area:$("edit_area").value.trim(),
    phase:$("edit_phase").value.trim(),
    precinct:$("edit_precinct").value.trim(),
    sector:$("edit_sector").value.trim(),
    block:$("edit_block").value.trim(),
    address:$("edit_address").value.trim(),

    footfall:
      Number($("edit_footfall").value || 0),

    shop_size:
      $("edit_shop_size").value.trim(),

    lcd_status:
      $("edit_lcd_status").value,

    lcd_total_price:
      Number($("edit_lcd_total_price").value || 0),

    lcd_down_payment:
      Number($("edit_lcd_down_payment").value || 0),

    lcd_monthly_installment:
      Number($("edit_lcd_monthly_installment").value || 0),

    lcd_installment_months:
      Number($("edit_lcd_installment_months").value || 0),

    online_status:
      $("edit_online_status").value === "true",

    internet_status:
      $("edit_internet_status").value.trim(),

    internet_provider:
      $("edit_internet_provider").value.trim(),

    internet_company_required:
      $("edit_internet_company_required").value === "true",

    opening_time:
      $("edit_opening_time").value || null,

    closing_time:
      $("edit_closing_time").value || null,

    ice_cream_fridge:
      $("edit_ice_cream_fridge").value === "true",

    bank_name:
      $("edit_bank_name").value.trim(),

    account_title:
      $("edit_account_title").value.trim(),

    account_number:
      $("edit_account_number").value.trim(),

    iban:
      $("edit_iban").value.trim(),

    payment_method:
      $("edit_payment_method").value.trim(),

    latitude:
      $("edit_latitude").value === ""
        ? null
        : Number($("edit_latitude").value),

    longitude:
      $("edit_longitude").value === ""
        ? null
        : Number($("edit_longitude").value),

    status:
      $("edit_status").value,

    updated_at:
      new Date().toISOString()
  };

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("vendors")
        .update(payload)
        .eq("id",id)
        .select("*")
        .maybeSingle();

    if(error){

      console.error(error);
      toast(error.message || "Vendor update failed.");
      return;
    }

    if(!data){

      toast("Vendor was not updated.");
      return;
    }

    const oldVendor =
      getVendorById(id);

    const oldStatus =
      String(oldVendor?.status || "").toLowerCase();

    const newStatus =
      String(data.status || "").toLowerCase();

    const index =
      vendors.findIndex(
        v => String(v.id) === String(id)
      );

    if(index !== -1){
      vendors[index] = data;
    }

    /*
      If edit changes pending -> approved,
      also create proper notifications.
    */

    if(
      oldStatus !== "approved" &&
      newStatus === "approved"
    ){

      await createVendorApprovalNotification(data);

      await createAdminNotification({
        title:"Vendor Approved",
        message:`${data.vendor_name || data.owner_name || "Vendor"} has been approved.`,
        type:"vendor_approved",
        vendorId:data.id
      });
    }

    closeModal("editVendorModal");

    renderCurrentPage();

    await loadAdminNotifications();

    updateNotificationBadge();

    toast("Vendor updated successfully.");

  }catch(error){

    console.error(error);
    toast(error.message || "Vendor update failed.");

  }
}

/* =========================================================
   TIME / OFFLINE LOGIC
========================================================= */

function getMinutes(time){

  if(!time) return null;

  const str = String(time).slice(0,5);

  const parts = str.split(":");

  if(parts.length !== 2) return null;

  const h = Number(parts[0]);
  const m = Number(parts[1]);

  if(
    Number.isNaN(h) ||
    Number.isNaN(m)
  ){
    return null;
  }

  return h * 60 + m;
}

function currentMinutes(){

  const now = new Date();

  return now.getHours() * 60 +
         now.getMinutes();
}

function isWithinOpeningHours(vendor){

  const opening =
    getMinutes(vendor.opening_time);

  const closing =
    getMinutes(vendor.closing_time);

  if(opening === null || closing === null){
    return false;
  }

  const now =
    currentMinutes();

  /*
    Normal schedule:
    10:00 -> 22:00
  */

  if(opening < closing){

    return (
      now >= opening &&
      now < closing
    );
  }

  /*
    Overnight schedule:
    22:00 -> 02:00
  */

  if(opening > closing){

    return (
      now >= opening ||
      now < closing
    );
  }

  /*
    Same opening/closing means no
    valid operating window.
  */

  return false;
}

function isEligibleOfflineVendor(vendor){

  if(!vendor) return false;

  /*
    RULE 1:
    Only approved vendors.
  */

  if(
    String(vendor.status || "").toLowerCase()
      !== "approved"
  ){
    return false;
  }

  /*
    RULE 2:
    Shop must currently be open.
  */

  if(!isWithinOpeningHours(vendor)){
    return false;
  }

  /*
    RULE 3:
    LCD must actually be offline.
  */

  const lcd =
    String(vendor.lcd_status || "").toLowerCase();

  const online =
    vendor.online_status === true;

  if(
    lcd === "offline" ||
    lcd === "off" ||
    online === false
  ){
    return true;
  }

  return false;
}

function getOfflineVendors(){

  return vendors.filter(
    isEligibleOfflineVendor
  );
}

/* =========================================================
   OFFLINE NOTIFICATIONS
========================================================= */

async function checkOfflineNotifications(){

  const offline =
    getOfflineVendors();

  const currentIds =
    new Set(
      offline
        .filter(v=>v.id)
        .map(v=>String(v.id))
    );

  /*
    Remove vendors that are no longer offline
    from local notification state.
  */

  for(const id of Array.from(
    offlineNotificationState
  )){

    if(!currentIds.has(id)){
      offlineNotificationState.delete(id);
    }
  }

  /*
    Only create notification when a vendor
    enters eligible offline state.
  */

  for(const vendor of offline){

    if(!vendor.id) continue;

    const id =
      String(vendor.id);

    if(
      offlineNotificationState.has(id)
    ){
      continue;
    }

    /*
      Check today's existing notification
      so refreshes do not create duplicates.
    */

    const start =
      new Date();

    start.setHours(0,0,0,0);

    const {
      data:existing,
      error
    } =
      await supabaseClient
        .from("admin_notifications")
        .select("id")
        .eq("vendor_id",vendor.id)
        .eq("type","lcd_offline")
        .gte("created_at",start.toISOString())
        .limit(1);

    if(error){
      console.error(error);
      continue;
    }

    if(!existing || !existing.length){

      await createAdminNotification({
        title:"LCD Offline",
        message:`${vendor.vendor_name || vendor.owner_name || "Vendor"}'s LCD is offline during shop operating hours.`,
        type:"lcd_offline",
        vendorId:vendor.id
      });

    }

    offlineNotificationState.add(id);
  }

  await loadAdminNotifications();
  updateNotificationBadge();
}

function renderVendors(){

        status === vendorFilter;

    });

  $("content").innerHTML = `

                : `
                  <tr>
                    <td colspan="6">
                      <div class="empty">
                        No vendors found.
                      </div>
                    </td>
                  </tr>
                `
            }

          </tbody>

        </table>

      </div>

    </div>

  search.addEventListener("input",e=>{

    const el = $("vendorSearch");
    el.setSelectionRange(
      el.value.length,
      el.value.length
    );
  });

  filter.addEventListener("change",e=>{
    vendorFilter = e.target.value;
    renderVendors();
  });

  $("vendorsTable").addEventListener(
    "click",
    async event=>{

      const button =
        event.target.closest(
          "[data-action][data-id]"
        );

      if(!button) return;

      const id =
        button.dataset.id;

      const action =
        button.dataset.action;

      if(action === "view"){
        viewVendor(id);
        return;
      }

      if(action === "edit"){
        editVendor(id);
        return;
      }

      if(action === "approve"){
        await approveVendor(id);
        return;
      }

      if(action === "reject"){
        await rejectVendor(id);
        return;
      }

      if(action === "delete"){
        await deleteVendor(id);
        return;
      }

    }
  );
}

    status === "approved"
      ? `<span class="badge approved">Approved</span>`
      : status === "rejected"
        ? `<span class="badge rejected">Rejected</span>`
        : `<span class="badge pending">Pending</span>`;

  const lcd =
    String(v.lcd_status || "").toLowerCase();

  const lcdOnline =
    v.online_status === true ||
    lcd === "online";

  const onlineBadge =
    lcdOnline
      ? `<span class="badge online">Online</span>`
      : `<span class="badge offline">Offline</span>`;

  let actions = `

      class="action-btn"

      title="View">
      👁
    </button>

    <button
      class="action-btn edit"
      data-action="edit"
      data-id="${esc(v.id)}"
      title="Edit">
      ✏

  if(status === "pending"){

    actions += `

      <button

        data-id="${esc(v.id)}">
        Approve
      </button>

        class="action-btn reject"
        data-action="reject"
        data-id="${esc(v.id)}">
        Reject
      </button>

    `;

  }else if(status === "rejected"){

    actions += `

      <button
        class="action-btn approve"
        data-action="approve"
        data-id="${esc(v.id)}">
        Approve
      </button>

    `;
  }

  return `

    <tr>

      <td>
        <div class="vendor-name">
          ${esc(v.vendor_name || "—")}
        </div>

        <div class="vendor-sub">
          ${esc(v.owner_name || "")}

      <td>

      <td>
        ${esc(v.category || "—")}

      </td>

      <td>

      </td>

}

      <p>Admin settings.</p>
    </div>
  `;
}

/* =========================================================
   ROUTER
========================================================= */

const pageNames = {
  dashboard:"Dashboard",
  vendors:"Vendors",
  notifications:"Notifications",
  packages:"Packages",
  ads:"Ads",
  upcoming:"Upcoming Ads",
  monitoring:"Screen Monitoring",
  withdrawals:"Withdrawals",
  complaints:"Complaints",
  formbuilder:"Form Builder",
  settings:"Settings"
};

function goPage(page){

  currentPage = page;

  hideNotificationPanel();

  $("pageTitle").textContent =
    pageNames[page] || "Dashboard";

  document
    .querySelectorAll(".nav-btn[data-page]")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );
    });

  renderCurrentPage();

  $("sidebar").classList.remove("open");
}

function renderCurrentPage(){

  switch(currentPage){

    case "vendors":
      renderVendors();
      break;

    case "notifications":
      renderNotifications();
      break;

    case "monitoring":
      renderMonitoring();
      break;

    case "packages":
      renderPackages();
      break;

    case "ads":
      renderAds();
      break;

    case "upcoming":
      renderUpcoming();
      break;

    case "withdrawals":
      renderWithdrawals();
      break;

    case "complaints":
      renderComplaints();
      break;

    case "formbuilder":
      renderFormBuilder();
      break;

    case "settings":
      renderSettings();
      break;

    default:
      renderDashboard();
  }
}

/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  realtimeChannels.forEach(channel=>{
    try{
      supabaseClient.removeChannel(channel);
    }catch(e){}
  });

  realtimeChannels = [];

  const vendorChannel =
    supabaseClient
      .channel("admin-vendors-realtime")
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"vendors"
        },
        async payload=>{

          console.log(
            "Vendor realtime:",
            payload
          );

          await loadVendors();

          /*
            New vendor notification.
          */

          if(payload.eventType === "INSERT"){

            const v =
              payload.new;

            await createAdminNotification({
              title:"New Vendor Approval Request",
              message:`${v.vendor_name || v.owner_name || "A vendor"} has submitted a registration for approval.`,
              type:"vendor_pending",
              vendorId:v.id
            });

            await loadAdminNotifications();
          }

          renderCurrentPage();
          updateNotificationBadge();

        }
      )
      .subscribe();

  realtimeChannels.push(vendorChannel);

  const notificationChannel =
    supabaseClient
      .channel("admin-notifications-realtime")
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"admin_notifications"
        },
        async payload=>{

          console.log(
            "Admin notification realtime:",
            payload
          );

          await loadAdminNotifications();

          updateNotificationBadge();

          if(currentPage === "notifications"){
            renderNotifications();
          }

          renderNotificationPanel();

        }
      )
      .subscribe();

  realtimeChannels.push(
    notificationChannel
  );

  const vendorNotificationChannel =
    supabaseClient
      .channel("vendor-notifications-admin-listener")
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"vendor_notifications"
        },
        payload=>{

          /*
            Intentionally do NOTHING.

            Vendor notifications are for vendors.
            They must never be displayed as admin
            notifications.
          */

          console.log(
            "Vendor notification ignored by admin:",
            payload.new
          );

        }
      )
      .subscribe();

  realtimeChannels.push(
    vendorNotificationChannel
  );
}

/* =========================================================
   PERIODIC MONITOR
========================================================= */

setInterval(async ()=>{

  if(!currentAdmin) return;

  await loadVendors();

  await checkOfflineNotifications();

  if(
    currentPage === "monitoring" ||
    currentPage === "dashboard"
  ){
    renderCurrentPage();
  }

},30000);

/*
  Check immediately after login/page load.
*/

setInterval(async ()=>{

  if(!currentAdmin) return;

  await checkOfflineNotifications();

},60000);

/* =========================================================
   MOBILE
========================================================= */

function toggleSidebar(){
  $("sidebar")
    .classList.toggle("open");
}

/* =========================================================
   MODAL OUTSIDE CLICK
========================================================= */

[
  "vendorDetailModal",
  "editVendorModal",
  "confirmModal"
].forEach(id=>{

  $(id).addEventListener(
    "click",
    event=>{

      if(event.target === $(id)){
        closeModal(id);
      }

    }
  );

});

/* =========================================================
   START
========================================================= */

(async function(){

  await restoreSession();

})();
</script>
