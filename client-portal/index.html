        <form id="loginForm">

          <div class="field">

  <script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL = "https://ausocdplliuftdqxbvwa.supabase.co";

    const SUPABASE_KEY = "sb_publishable_MOXjixlgTPDBvrD3nZP81Q_9n30a-et";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // ==========================================
    // LOGIN
    // ==========================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.className = "message error";
        message.textContent = error.message;

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";

        return;
      }


      message.className = "message success";
      message.textContent = "Login successful. Opening your portal...";


      // Temporary redirect.
      // Baad mein isko actual dashboard page se connect karenge.

      setTimeout(function() {
        window.location.href = "dashboard.html";
      }, 800);

    });

  </script>
