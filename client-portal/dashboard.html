<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWSZ Client Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f4f8fc;
  --bg2:#eaf2fa;
  --blue:#246bce;
  --blue-dark:#123b70;
  --text:#20272e;
  --muted:#66778a;
  --line:#d8e4ef;
  --white:#fff;
  --green:#20855a;
  --green-bg:#eaf7f0;
  --amber:#b97918;
  --amber-bg:#fff5df;
  --red:#c33d3d;
  --red-bg:#fff0f0;
  --shadow:0 12px 35px rgba(24,61,99,.08);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= AUTH ================= */

.auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  background:
    radial-gradient(circle at 15% 10%,#fff,transparent 35%),
    linear-gradient(135deg,#f7fbff,#e9f3fc);
}

.auth-card{
  width:min(430px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:25px;
  padding:38px;
  box-shadow:var(--shadow);
}

.logo{
  font-size:30px;
  font-weight:900;
  color:var(--blue-dark);
  letter-spacing:-1.5px;
}

.logo span{
  color:var(--blue);
}

.auth-card h1{
  margin:35px 0 8px;
  font-size:28px;
}

.auth-card p{
  color:var(--muted);
  line-height:1.6;
}

.field{
  margin:18px 0;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  outline:none;
  background:#fff;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(36,107,206,.1);
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 17px;
  font-weight:800;
}

.btn-primary{
  background:var(--blue);
  color:white;
}

.btn-secondary{
  background:var(--bg2);
  color:var(--blue-dark);
}

.btn-full{
  width:100%;
}

.auth-error{
  margin-top:14px;
  color:var(--red);
  font-size:13px;
}

/* ================= APP ================= */

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:255px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:24px 15px;
  z-index:100;
}

.sidebar-logo{
  padding:8px 12px 32px;
}

.nav-label{
  font-size:10px;
  font-weight:900;
  color:#9aa8b6;
  letter-spacing:1px;
  text-transform:uppercase;
  padding:0 12px;
  margin:15px 0 8px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.nav button{
  border:0;
  background:transparent;
  color:#5e6f80;
  padding:13px 12px;
  border-radius:11px;
  text-align:left;
  font-weight:750;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
}

.nav button:hover{
  background:var(--bg);
  color:var(--blue-dark);
}

.nav button.active{
  background:var(--bg2);
  color:var(--blue);
}

.nav-icon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.badge{
  margin-left:auto;
  background:var(--blue);
  color:#fff;
  min-width:20px;
  height:20px;
  border-radius:20px;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
}

.sidebar-user{
  position:absolute;
  left:15px;
  right:15px;
  bottom:20px;
  padding:15px 10px;
  border-top:1px solid var(--line);
  display:flex;
  gap:10px;
  align-items:center;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--bg2);
  color:var(--blue-dark);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:900;
}

.user-name{
  font-size:12px;
  font-weight:850;
}

.user-email{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
  max-width:150px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* ================= MAIN ================= */

.main{
  margin-left:255px;
  width:calc(100% - 255px);
  min-height:100vh;
}

.topbar{
  height:75px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:50;
}

.top-title{
  font-size:20px;
  font-weight:900;
}

.top-actions{
  display:flex;
  gap:9px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  position:relative;
}

.dot{
  position:absolute;
  right:6px;
  top:6px;
  width:7px;
  height:7px;
  background:var(--blue);
  border-radius:50%;
  border:2px solid white;
}

.content{
  padding:32px;
  max-width:1450px;
  margin:auto;
}

.heading{
  margin-bottom:25px;
}

.heading h1{
  margin:0 0 7px;
  font-size:30px;
  letter-spacing:-.7px;
}

.heading p{
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

/* ================= CARDS ================= */

.grid{
  display:grid;
  gap:18px;
}

.grid-4{
  grid-template-columns:repeat(4,1fr);
}

.grid-3{
  grid-template-columns:repeat(3,1fr);
}

.grid-2{
  grid-template-columns:repeat(2,1fr);
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 7px 25px rgba(25,60,95,.04);
}

.card-pad{
  padding:22px;
}

.stat{
  padding:22px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
}

.stat-value{
  font-size:29px;
  font-weight:900;
  color:var(--blue-dark);
  margin-top:8px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:17px;
}

.section-title h2{
  margin:0;
  font-size:18px;
}

.link{
  color:var(--blue);
  font-size:12px;
  font-weight:850;
  border:0;
  background:none;
}

/* ================= STATUS ================= */

.status{
  display:inline-flex;
  border-radius:30px;
  padding:6px 10px;
  font-size:10px;
  font-weight:900;
}

.active{
  background:var(--green-bg);
  color:var(--green);
}

.pending{
  background:var(--amber-bg);
  color:var(--amber);
}

.paid{
  background:var(--green-bg);
  color:var(--green);
}

.overdue{
  background:var(--red-bg);
  color:var(--red);
}

/* ================= PROJECT ================= */

.project-card{
  padding:23px;
}

.project-title{
  font-size:20px;
  font-weight:900;
}

.project-desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin:9px 0 20px;
}

.progress{
  height:9px;
  border-radius:20px;
  overflow:hidden;
  background:var(--bg2);
}

.progress-bar{
  height:100%;
  background:var(--blue);
  border-radius:20px;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
  margin-top:7px;
}

.stage{
  margin-top:18px;
  padding:13px;
  background:var(--bg);
  border-radius:11px;
}

.stage-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  font-weight:900;
}

.stage-value{
  margin-top:5px;
  font-size:14px;
  font-weight:850;
}

/* ================= PROJECT TABS ================= */

.project-tabs{
  display:flex;
  gap:5px;
  padding:6px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  margin-bottom:20px;
  overflow-x:auto;
}

.project-tab{
  border:0;
  background:transparent;
  padding:10px 15px;
  border-radius:9px;
  color:var(--muted);
  font-size:12px;
  font-weight:850;
  white-space:nowrap;
}

.project-tab.active{
  background:var(--bg2);
  color:var(--blue);
}

/* ================= CHAT ================= */

.chat-wrapper{
  height:calc(100vh - 145px);
  min-height:550px;
  display:flex;
  flex-direction:column;
}

.chat-header{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px 16px 0 0;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.chat-header-title{
  font-size:16px;
  font-weight:900;
}

.chat-header-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.chat-area{
  flex:1;
  overflow-y:auto;
  padding:25px;
  background:#eaf2f9;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}

.chat-empty{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:var(--muted);
}

.chat-empty-icon{
  font-size:42px;
  margin-bottom:12px;
}

.message{
  display:flex;
  margin-bottom:13px;
}

.message.client{
  justify-content:flex-end;
}

.message.admin{
  justify-content:flex-start;
}

.bubble{
  max-width:min(70%,600px);
  padding:12px 14px;
  border-radius:15px;
  background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.04);
}

.client .bubble{
  background:var(--blue);
  color:#fff;
  border-bottom-right-radius:4px;
}

.admin .bubble{
  border-bottom-left-radius:4px;
}

.sender{
  font-size:9px;
  font-weight:900;
  opacity:.65;
  margin-bottom:5px;
}

.message-text{
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.message-time{
  font-size:9px;
  opacity:.6;
  text-align:right;
  margin-top:5px;
}

.chat-compose{
  background:#fff;
  border:1px solid var(--line);
  border-radius:0 0 16px 16px;
  padding:12px;
  display:flex;
  align-items:flex-end;
  gap:8px;
}

.chat-compose textarea{
  flex:1;
  resize:none;
  min-height:45px;
  max-height:120px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  outline:none;
}

.send{
  width:45px;
  height:45px;
  border:0;
  border-radius:11px;
  background:var(--blue);
  color:#fff;
}

/* ================= CREDENTIALS ================= */

.credential-form{
  background:var(--bg);
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}

.credential-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.credential-item{
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin-bottom:12px;
}

.credential-name{
  font-weight:900;
  font-size:16px;
  margin-bottom:12px;
}

.credential-value{
  background:var(--bg);
  border-radius:8px;
  padding:9px;
  margin-top:5px;
  font-size:12px;
  word-break:break-all;
}

.credential-label{
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  margin-top:9px;
}

/* ================= DOCUMENTS / INVOICES ================= */

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.row:last-child{
  border-bottom:0;
}

.row-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.file-icon{
  width:42px;
  height:42px;
  background:var(--bg2);
  color:var(--blue);
  border-radius:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.row-title{
  font-size:13px;
  font-weight:850;
}

.row-sub{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

/* ================= ACCOUNT ================= */

.account-form{
  max-width:800px;
}

.account-form .field{
  margin-bottom:18px;
}

/* ================= MOBILE ================= */

.mobile-header{
  display:none;
}

.bottom-nav{
  display:none;
}

@media(max-width:1050px){

  .grid-4{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:760px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .topbar{
    display:none;
  }

  .mobile-header{
    display:flex;
    height:62px;
    background:#fff;
    border-bottom:1px solid var(--line);
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:50;
  }

  .content{
    padding:20px 15px 90px;
  }

  .grid-4,
  .grid-3,
  .grid-2{
    grid-template-columns:1fr;
  }

  .heading h1{
    font-size:26px;
  }

  .credential-row{
    grid-template-columns:1fr;
  }

  .chat-wrapper{
    height:calc(100vh - 110px);
    min-height:500px;
  }

  .bubble{
    max-width:85%;
  }

  .bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:66px;
    background:#fff;
    border-top:1px solid var(--line);
    z-index:100;
    display:flex;
    justify-content:space-around;
    align-items:center;
  }

  .bottom-nav button{
    border:0;
    background:none;
    color:var(--muted);
    font-size:9px;
    font-weight:850;
  }

  .bottom-nav button.active{
    color:var(--blue);
  }

  .bottom-icon{
    display:block;
    font-size:18px;
    margin-bottom:3px;
  }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="auth" class="auth">

  <div class="auth-card">

    <div class="logo">AWSZ<span>.</span></div>

    <h1>Client Portal</h1>

    <p>
      Access your project, credentials, messages,
      documents and invoices in one place.
    </p>

    <form id="loginForm">

      <div class="field">
        <label>Email</label>
        <input
          id="email"
          type="email"
          required
          placeholder="you@example.com"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="password"
          type="password"
          required
          placeholder="Your password"
        >
      </div>

      <button class="btn btn-primary btn-full">
        Sign In
      </button>

    </form>

    <div id="loginError" class="auth-error"></div>

  </div>

</div>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">
      <div class="logo">AWSZ<span>.</span></div>
    </div>

    <div class="nav-label">Portal</div>

    <nav class="nav">

      <button data-view="dashboard">
        <span class="nav-icon">⌂</span>
        Dashboard
      </button>

      <button data-view="project">
        <span class="nav-icon">▦</span>
        My Project
      </button>

      <button data-view="credentials">
        <span class="nav-icon">🔐</span>
        Credentials
      </button>

      <button data-view="chat">
        <span class="nav-icon">◌</span>
        Chat
        <span id="chatBadge" class="badge hidden">0</span>
      </button>

      <button data-view="documents">
        <span class="nav-icon">▤</span>
        Documents
      </button>

      <button data-view="invoices">
        <span class="nav-icon">$</span>
        Invoices
      </button>

    </nav>

    <div class="nav-label">Account</div>

    <nav class="nav">

      <button data-view="account">
        <span class="nav-icon">◉</span>
        Account
      </button>

      <button id="logout">
        <span class="nav-icon">↪</span>
        Sign Out
      </button>

    </nav>

    <div class="sidebar-user">

      <div id="avatar" class="avatar">C</div>

      <div>
        <div id="userName" class="user-name">Client</div>
        <div id="userEmail" class="user-email">—</div>
      </div>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="mobile-header">

      <div class="logo">AWSZ<span>.</span></div>

      <button
        class="icon-btn"
        onclick="navigate('account')"
      >
        ◉
      </button>

    </header>


    <header class="topbar">

      <div id="topTitle" class="top-title">
        Dashboard
      </div>

      <div class="top-actions">

        <button
          class="icon-btn"
          onclick="navigate('chat')"
        >
          ◌
          <span id="messageDot" class="dot hidden"></span>
        </button>

        <button
          class="icon-btn"
          onclick="navigate('account')"
        >
          ◉
        </button>

      </div>

    </header>


    <section id="content" class="content"></section>

  </main>


  <!-- MOBILE -->

  <nav class="bottom-nav">

    <button data-mobile="dashboard">
      <span class="bottom-icon">⌂</span>
      Home
    </button>

    <button data-mobile="project">
      <span class="bottom-icon">▦</span>
      Project
    </button>

    <button data-mobile="chat">
      <span class="bottom-icon">◌</span>
      Chat
    </button>

    <button data-mobile="invoices">
      <span class="bottom-icon">$</span>
      Bills
    </button>

    <button data-mobile="account">
      <span class="bottom-icon">◉</span>
      Account
    </button>

  </nav>

</div>


<script>
/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
"https://ausocdplliuftdqxbvwa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MOXjixlgTPDBvrD3nZP81Q_9n30a-et";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

const state = {
  user:null,
  client:null,
  project:null,
  messages:[],
  credentials:[],
  documents:[],
  invoices:[],
  currentView:"dashboard",
  messageChannel:null
};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function initials(name){

  if(!name){
    return "C";
  }

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}


function date(value){

  if(!value){
    return "—";
  }

  return new Date(value).toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}


function time(value){

  if(!value){
    return "";
  }

  return new Date(value).toLocaleTimeString(
    undefined,
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


function toast(message){

  const el =
    document.createElement("div");

  el.style.cssText = `
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:9999;
    background:#fff;
    border:1px solid #d8e4ef;
    border-left:4px solid #246bce;
    border-radius:12px;
    padding:14px 17px;
    box-shadow:0 12px 35px rgba(24,61,99,.12);
    font-size:13px;
    font-weight:750;
  `;

  el.textContent = message;

  document.body.appendChild(el);

  setTimeout(
    () => el.remove(),
    3000
  );
}


/* =========================================================
   AUTH
========================================================= */

async function init(){

  const {
    data
  } =
  await supabaseClient.auth.getSession();

  if(data.session){

    state.user =
      data.session.user;

    await startPortal();

  }else{

    showLogin();

  }
}


function showLogin(){

  $("auth").classList.remove("hidden");

  $("app").classList.add("hidden");

}


async function startPortal(){

  $("auth").classList.add("hidden");

  $("app").classList.remove("hidden");

  await loadAll();

  updateUserUI();

  navigate("dashboard");

  subscribeToMessages();

}

    $("loginError").textContent =

    });

    }

    state.user = data.user;

    await startPortal();

);

  async () => {

    if(state.messageChannel){

      await supabaseClient.removeChannel(
        state.messageChannel
      );

    }

    await supabaseClient.auth.signOut();

    location.reload();

  }
);

function navigate(view){

  state.currentView=view;

  document
    .querySelectorAll(".nav button[data-view]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.view === view
      );

    });

  document
    .querySelectorAll(".bottom-nav button[data-mobile]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.mobile === view
      );

    });

  $("topTitle").textContent =
    titles[view] || "Client Portal";

  switch(view){

    case "dashboard":
      renderDashboard();
      break;

    case "project":
      renderProject();
      break;

    case "credentials":
      renderCredentials();
      break;

    case "chat":
      renderChat();
      break;

    case "documents":
      renderDocuments();
      break;

    case "invoices":
      renderInvoices();
      break;

    case "account":
      renderAccount();
      break;

  }

}

function messageHtml(message){

  const sender =
    String(message.sender_type || "")
      .toLowerCase();

  const client =
    sender === "client";


  return `

    <div class="message ${
      client ? "client" : "admin"
    }">

      <div class="bubble">

        <div class="sender">
          ${
            client
            ? "You"
            : escapeHtml(
                message.sender_name ||
                "AWSZ Team"
              )
          }
        </div>

        <div class="message-text">
          ${escapeHtml(message.message)}
        </div>

        <div class="message-time">
          ${time(message.created_at)}
        </div>

      </div>

    </div>

  `;

}


function scrollChat(){

  const area =
    $("chatArea");

  if(area){

    area.scrollTop =
      area.scrollHeight;

  }

}


async function sendMessage(e){

  e.preventDefault();

  const input =
    $("messageInput");

  const message =
    input.value.trim();

  if(!message){
    return;
  }

  if(!state.project){
    return;
  }

  input.disabled=true;

  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({

      project_id:
        state.project.id,

      sender_type:
        "client",

      sender_name:
        state.client?.full_name ||
        state.user.email ||
        "Client",

      message:
        message

    });


  input.disabled=false;


  if(error){

    console.error(
      "MESSAGE INSERT ERROR:",
      error
    );

    toast(
      "Message could not be sent: " +
      error.message
    );

    return;

  }


  input.value="";

  await loadMessages();

  renderChat();

}


/* =========================================================
   REALTIME CHAT
========================================================= */

function subscribeToMessages(){

  if(!state.project){
    return;
  }

  if(state.messageChannel){

    supabaseClient.removeChannel(
      state.messageChannel
    );

  }


  state.messageChannel =
    supabaseClient
      .channel(
        "client-project-chat-" +
        state.project.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "project_id=eq." +
            state.project.id
        },
        async payload => {

          await loadMessages();

          if(state.currentView === "chat"){

            renderChat();

          }

          updateMessageBadge();

        }
      )
      .subscribe();

}


function updateMessageBadge(){

  const count =
    state.messages.filter(
      m =>
        String(m.sender_type)
          .toLowerCase() !== "client"
    ).length;

  const badge =
    $("chatBadge");

  if(count > 0){

    badge.classList.remove("hidden");

    badge.textContent =
      count > 99 ? "99+" : count;

    $("messageDot")
      .classList.remove("hidden");

  }else{

    badge.classList.add("hidden");

    $("messageDot")
      .classList.add("hidden");

  }

}

              `
                <a
                  href="${escapeHtml(document.file_url)}"
                  target="_blank"
                  rel="noopener"
                  class="btn btn-secondary"
                >
                  Download
                </a>
              `
              :
              `
                <span class="row-sub">
                  No file
                </span>
              `
            }

          </div>

        `).join("")
        :
        `
          <div class="card-pad"
            style="
              background:var(--bg);
              border-radius:12px;
              color:var(--muted);
            "
          >
            No documents have been shared yet.
          </div>
        `
      }

    </div>

  `;

}


/* =========================================================
   INVOICES
========================================================= */

function invoiceStatus(status){

  const s =
    String(status || "pending")
      .toLowerCase();

  let cls="pending";

  if(s === "paid"){
    cls="paid";
  }

  if(s === "overdue"){
    cls="overdue";
  }

  return `
    <span class="status ${cls}">
      ${escapeHtml(status || "Pending")}
    </span>
  `;

}

/* =========================================================
   ACCOUNT
========================================================= */

function renderAccount(){

  const name =
    state.client?.full_name || "";

  const company =
    state.client?.company_name || "";

  const phone =
    state.client?.phone || "";

  $("content").innerHTML = `

    <div class="heading">

      <h1>Account</h1>

      <p>
        Manage your basic account information.
      </p>

    </div>


    <div class="card card-pad account-form">

      <div class="field">

        <label>Full Name</label>

        <input
          id="accountName"
          value="${escapeHtml(name)}"
        >

      </div>


      <div class="field">

        <label>Company</label>

        <input
          id="accountCompany"
          value="${escapeHtml(company)}"
        >

      </div>


      <div class="field">

        <label>Phone</label>

        <input
          id="accountPhone"
          value="${escapeHtml(phone)}"
        >

      </div>


      <div class="field">

        <label>Email</label>

        <input
          class="readonly"
          readonly
          value="${escapeHtml(
            state.user.email || ""
          )}"
        >

      </div>


      <button
        class="btn btn-primary"
        onclick="saveAccount()"
      >
        Save Changes
      </button>

    </div>

  `;

}


async function saveAccount(){

  const {
    error
  } =
  await supabaseClient
    .from("clients")
    .update({

      full_name:
        $("accountName").value.trim(),

      company_name:
        $("accountCompany").value.trim(),

      phone:
        $("accountPhone").value.trim()

    })
    .eq("id",state.user.id);


  if(error){

    console.error(error);

    toast(
      "Account could not be updated."
    );

    return;

  }


  await loadClient();

  updateUserUI();

  toast("Account updated.");

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event,session) => {

    if(!session){

      showLogin();

      return;

    }

    if(!state.user){

      state.user =
        session.user;

      await startPortal();

    }

  }
);


/* =========================================================
   START
========================================================= */

init();

</script>
