<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --cloud:#f4f8fc;
  --cloud2:#eaf2fa;
  --cloud3:#dceaf7;
  --blue:#246bce;
  --blue-dark:#123b70;
  --deep:#0b2850;
  --text:#20272e;
  --muted:#66778a;
  --line:#d8e4ef;
  --white:#ffffff;
  --green:#20855a;
  --green-bg:#eaf7f0;
  --amber:#b97918;
  --amber-bg:#fff5df;
  --red:#c33d3d;
  --red-bg:#fff0f0;
  --shadow:0 12px 35px rgba(20,55,90,.08);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:var(--cloud);
  color:var(--text);
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top right,#dceaf7 0,transparent 35%),
    linear-gradient(135deg,#f7fbff,#edf5fc);
}

.login-card{
  width:100%;
  max-width:430px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:38px;
  box-shadow:var(--shadow);
}

.login-logo{
  width:54px;
  height:54px;
  border-radius:15px;
  background:var(--deep);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:17px;
  margin-bottom:22px;
}

.login-card h1{
  margin:0 0 8px;
  font-size:30px;
}

.login-card p{
  color:var(--muted);
  margin:0 0 28px;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:13px 14px;
  font-size:15px;
  outline:none;
  transition:.2s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(36,107,206,.08);
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px 18px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  font-size:15px;
}

.primary-btn:hover{
  background:var(--blue-dark);
}

.error-box{
  background:var(--red-bg);
  color:var(--red);
  border:1px solid #f2cccc;
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  margin-bottom:16px;
}

/* =========================
   APP
========================= */

#app{
  min-height:100vh;
}

.app-layout{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:255px;
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  z-index:50;
  display:flex;
  flex-direction:column;
}

.brand{
  padding:25px 22px;
  border-bottom:1px solid var(--line);
}

.brand-mark{
  display:inline-flex;
  width:46px;
  height:46px;
  align-items:center;
  justify-content:center;
  background:var(--deep);
  color:#fff;
  border-radius:13px;
  font-size:14px;
  font-weight:800;
}

.brand-name{
  margin-top:11px;
  font-weight:800;
  font-size:17px;
}

.brand-sub{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.nav{
  padding:17px 12px;
  flex:1;
  overflow-y:auto;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 13px;
  margin-bottom:4px;
  border-radius:11px;
  color:#4b5d70;
  font-size:14px;
  font-weight:600;
}

.nav-btn:hover{
  background:var(--cloud);
  color:var(--deep);
}

.nav-btn.active{
  background:var(--cloud2);
  color:var(--blue-dark);
}

.nav-icon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.nav-badge{
  margin-left:auto;
  min-width:20px;
  height:20px;
  padding:0 6px;
  border-radius:20px;
  background:var(--red);
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.sidebar-bottom{
  padding:15px;
  border-top:1px solid var(--line);
}

.connection-status{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--muted);
}

.connection-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#bbb;
}

.connection-dot.online{
  background:#22a66b;
  box-shadow:0 0 0 4px rgba(34,166,107,.1);
}

.connection-dot.offline{
  background:#d64a4a;
}

/* MAIN */

.main{
  margin-left:255px;
  width:calc(100% - 255px);
  min-width:0;
}

.topbar{
  height:76px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  position:sticky;
  top:0;
  z-index:30;
}

.topbar-title{
  font-size:18px;
  font-weight:800;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.live-indicator{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:var(--muted);
}

.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#20a36a;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

.sound-btn{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:8px 11px;
  font-size:13px;
  color:var(--deep);
}

.sound-btn.enabled{
  background:var(--green-bg);
  color:var(--green);
  border-color:#c8e7d8;
}

.mobile-menu{
  display:none;
  border:1px solid var(--line);
  background:#fff;
  border-radius:10px;
  padding:8px 10px;
}

.content{
  padding:30px;
  max-width:1400px;
  margin:0 auto;
}

/* =========================
   PAGE
========================= */

.page-header{
  margin-bottom:25px;
}

.page-header h1{
  margin:0 0 6px;
  font-size:28px;
}

.page-header p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

/* CARDS */

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 7px 25px rgba(30,65,100,.035);
}

.card-header{
  padding:19px 21px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.card-header h3{
  margin:0;
  font-size:16px;
}

.card-body{
  padding:21px;
}

.grid{
  display:grid;
  gap:18px;
}

.grid-4{
  grid-template-columns:repeat(4,1fr);
}

.grid-3{
  grid-template-columns:repeat(3,1fr);
}

.grid-2{
  grid-template-columns:repeat(2,1fr);
}

.stat-card{
  padding:21px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:10px;
}

.stat-value{
  font-size:27px;
  font-weight:800;
  color:var(--deep);
}

.stat-small{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

/* PROJECT */

.project-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:7px;
}

.project-description{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.progress-wrap{
  margin-top:20px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:13px;
  font-weight:700;
}

.progress{
  height:11px;
  background:#e7eef5;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--blue),#4f91e9);
  border-radius:20px;
  transition:width .5s ease;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:30px;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;
}

.badge.green{
  background:var(--green-bg);
  color:var(--green);
}

.badge.blue{
  background:#eaf2ff;
  color:var(--blue-dark);
}

.badge.amber{
  background:var(--amber-bg);
  color:var(--amber);
}

.badge.red{
  background:var(--red-bg);
  color:var(--red);
}

.info-list{
  display:grid;
  gap:0;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:13px 0;
  border-bottom:1px solid #edf2f6;
  font-size:14px;
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:var(--muted);
}

.info-value{
  font-weight:700;
  text-align:right;
}

/* CHAT */

.chat-shell{
  display:flex;
  flex-direction:column;
  height:calc(100vh - 136px);
  min-height:550px;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:22px;
  background:#f8fbfe;
}

.message-row{
  display:flex;
  margin-bottom:13px;
}

.message-row.client{
  justify-content:flex-end;
}

.message-row.admin{
  justify-content:flex-start;
}

.message-bubble{
  max-width:72%;
  border-radius:17px;
  padding:12px 14px;
  font-size:14px;
  line-height:1.5;
}

.message-row.client .message-bubble{
  background:var(--blue);
  color:#fff;
  border-bottom-right-radius:5px;
}

.message-row.admin .message-bubble{
  background:#fff;
  border:1px solid var(--line);
  color:var(--text);
  border-bottom-left-radius:5px;
}

.message-name{
  font-size:11px;
  font-weight:800;
  margin-bottom:4px;
  opacity:.7;
}

.message-time{
  font-size:10px;
  margin-top:5px;
  opacity:.65;
}

.chat-input{
  border-top:1px solid var(--line);
  background:#fff;
  padding:15px;
  display:flex;
  gap:10px;
}

.chat-input textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:130px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  outline:none;
}

.chat-input textarea:focus{
  border-color:var(--blue);
}

.send-btn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:12px;
  padding:0 21px;
  font-weight:700;
}

/* DOCUMENTS */

.document-row,
.invoice-row,
.credential-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:16px 0;
  border-bottom:1px solid #edf2f6;
}

.document-row:last-child,
.invoice-row:last-child,
.credential-row:last-child{
  border-bottom:0;
}

.item-main{
  min-width:0;
}

.item-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:5px;
}

.item-meta{
  color:var(--muted);
  font-size:12px;
}

.secondary-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--deep);
  border-radius:9px;
  padding:8px 12px;
  font-size:12px;
  font-weight:700;
  text-decoration:none;
  white-space:nowrap;
}

.secondary-btn:hover{
  background:var(--cloud);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:34px;
  margin-bottom:12px;
}

/* TOAST */

.toast-container{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:none;
}

.toast{
  min-width:290px;
  max-width:370px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 15px 40px rgba(0,0,0,.14);
  border-radius:15px;
  padding:14px 16px;
  animation:toastIn .25s ease;
  pointer-events:auto;
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.toast-title{
  font-weight:800;
  font-size:14px;
  margin-bottom:4px;
}

.toast-text{
  font-size:13px;
  color:var(--muted);
  line-height:1.4;
}

/* ACCOUNT */

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:17px;
}

/* MOBILE */

@media(max-width:950px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 16px;
  }

  .content{
    padding:20px 15px;
  }

  .grid-4{
    grid-template-columns:1fr 1fr;
  }

  .grid-3{
    grid-template-columns:1fr;
  }

  .grid-2{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  .topbar-title{
    font-size:15px;
  }

  .live-indicator{
    display:none;
  }

  .sound-btn{
    font-size:11px;
  }

  .page-header h1{
    font-size:24px;
  }

  .grid-4{
    grid-template-columns:1fr;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }

  .chat-shell{
    height:calc(100vh - 115px);
    min-height:500px;
  }

  .message-bubble{
    max-width:86%;
  }

  .chat-input{
    padding:10px;
  }

  .send-btn{
    padding:0 15px;
  }

  .document-row,
  .invoice-row,
  .credential-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .toast-container{
    left:12px;
    right:12px;
    bottom:12px;
  }

  .toast{
    min-width:0;
    width:100%;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="app" class="hidden">

<script>

/* ============================================================
   SUPABASE
============================================================ */

const SUPABASE_URL =

const SUPABASE_KEY =
  "sb_publishable_MOXjixlgTPDBvrD3nZP81Q_9n30a-et";

const supabaseClient =

/* ============================================================
   STATE
============================================================ */

let user = null;
let client = null;
let project = null;

let messages = [];
let credentials = [];
let documents = [];
let invoices = [];

let currentView = "dashboard";

let realtimeChannel = null;

let soundEnabled = false;
let audioContext = null;

let unreadMessages = 0;


/* ============================================================
   DOM
============================================================ */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const content =
  document.getElementById("content");

const topbarTitle =
  document.getElementById("topbarTitle");

const loginError =
  document.getElementById("loginError");

const chatBadge =
  document.getElementById("chatBadge");

const soundBtn =
  document.getElementById("soundBtn");

const connectionDot =
  document.getElementById("connectionDot");

const connectionText =
  document.getElementById("connectionText");

const sidebar =
  document.getElementById("sidebar");


/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatDate(value){

  if(!value){
    return "—";
  }

  return new Date(value).toLocaleDateString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  );
}


function formatDateTime(value){

  if(!value){
    return "—";
  }

  return new Date(value).toLocaleString(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


function money(amount,currency="USD"){

  if(amount === null || amount === undefined){
    return "—";
  }

  try{

    return new Intl.NumberFormat(
      undefined,
      {
        style:"currency",
        currency:currency || "USD"
      }
    ).format(Number(amount));

  }catch{

    return `${currency || "USD"} ${amount}`;
  }
}


function showError(message){

  loginError.textContent = message;
  loginError.classList.remove("hidden");

}


function hideError(){

  loginError.classList.add("hidden");
  loginError.textContent = "";

}


function showToast(title,text){

  const container =
    document.getElementById("toastContainer");

  const toast =
    document.createElement("div");

  toast.className = "toast";

  toast.innerHTML = `
    <div class="toast-title">
      ${escapeHtml(title)}
    </div>

    <div class="toast-text">
      ${escapeHtml(text)}
    </div>
  `;

  container.appendChild(toast);

    setTimeout(()=>{
      toast.remove();
    },250);

  },5000);
}


/* ============================================================
   SOUND
============================================================ */

async function enableSound(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioContext.state === "suspended"){
      await audioContext.resume();
    }

    /*
      Small silent/very-low interaction to unlock
      browser audio permission.
    */

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    gain.gain.value = 0.0001;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.03
    );

    soundEnabled = true;

    soundBtn.textContent =
      "🔔 Sound On";

    soundBtn.classList.add("enabled");

  }catch(error){

    console.warn(
      "Sound could not be enabled:",
      error
    );

  }
}


function playNotificationSound(){

  if(!soundEnabled){
    return;
  }

  try{

    if(
      !audioContext ||
      audioContext.state === "suspended"
    ){
      return;
    }

    const now =
      audioContext.currentTime;

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
      880,
      now
    );

    oscillator.frequency.setValueAtTime(
      1174,
      now + 0.12
    );

    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.16,
      now + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + 0.35
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.36);

  }catch(error){

    console.warn(
      "Notification sound error:",
      error
    );

  }
}

============================================================ */

function setConnectionStatus(status){

  if(status === "SUBSCRIBED"){

    connectionDot.className =
      "connection-dot online";

    connectionText.textContent =
      "Realtime connected";

  }

  else if(
    status === "CHANNEL_ERROR" ||
    status === "TIMED_OUT" ||
    status === "CLOSED"
  ){

    connectionDot.className =
      "connection-dot offline";

    connectionText.textContent =
      "Realtime disconnected";

  }

  else{

    connectionDot.className =
      "connection-dot";

    connectionText.textContent =
      "Connecting...";

  }
}

/* ============================================================
   LOAD ALL DATA
============================================================ */

async function loadAllData(){

  if(!user){
    return;
  }

  /*
    Load client profile
  */

  const {
    data:clientData,
    error:clientError
  } =
    await supabaseClient
      .from("clients")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  if(clientError){
    console.error(
      "Client load error:",
      clientError
    );
  }

  client = clientData || {
    id:user.id,
    full_name:user.user_metadata?.full_name || "",
    company_name:user.user_metadata?.company_name || "",
    email:user.email || "",
    phone:user.user_metadata?.phone || ""
  };


  /*
    Load latest project
  */

  const {
    data:projectData,
    error:projectError
  } =
    await supabaseClient
      .from("projects")
      .select("*")
      .eq("client_id",user.id)
      .order("created_at",{ascending:false})
      .limit(1)
      .maybeSingle();

  if(projectError){

    console.error(
      "Project load error:",
      projectError
    );

  }

  project = projectData || null;


  if(!project){

    messages = [];
    credentials = [];
    documents = [];
    invoices = [];

    return;
  }


  /*
    Load messages
  */

  const {
    data:messageData,
    error:messageError
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq("project_id",project.id)
      .order("created_at",{ascending:true});

  if(messageError){

    console.error(
      "Messages load error:",
      messageError
    );

  }

  messages = messageData || [];


  /*
    Credentials
  */

  const {
    data:credentialData,
    error:credentialError
  } =
    await supabaseClient
      .from("project_credentials")
      .select("*")
      .eq("project_id",project.id)
      .eq("client_id",user.id)
      .order("created_at",{ascending:false});

  if(credentialError){

    console.error(
      "Credentials load error:",
      credentialError
    );

  }

  credentials =
    credentialData || [];


  /*
    Documents
  */

  const {
    data:documentData,
    error:documentError
  } =
    await supabaseClient
      .from("documents")
      .select("*")
      .eq("project_id",project.id)
      .order("created_at",{ascending:false});

  if(documentError){

    console.error(
      "Documents load error:",
      documentError
    );

  }

  documents =
    documentData || [];


  /*
    Invoices
  */

  const {
    data:invoiceData,
    error:invoiceError
  } =
    await supabaseClient
      .from("invoices")
      .select("*")
      .eq("client_id",user.id)
      .order("created_at",{ascending:false});

  if(invoiceError){

    console.error(
      "Invoices load error:",
      invoiceError
    );

  }

  invoices =
    invoiceData || [];

}


/* ============================================================
   REALTIME
============================================================ */

function cleanupRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(realtimeChannel);

    realtimeChannel = null;

  }

  setConnectionStatus("CLOSED");
}


function setupRealtime(){

  cleanupRealtime();

  if(!user || !project){
    return;
  }

  const projectId =
    project.id;

  realtimeChannel =
    supabaseClient
      .channel(
        `client-portal-${user.id}-${projectId}`
      )


      /* =========================
         MESSAGES
      ========================= */

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:`project_id=eq.${projectId}`
        },
        payload => {

          const newMessage =
            payload.new;

          /*
            Prevent duplicate
          */

          const alreadyExists =
            messages.some(
              m => String(m.id) === String(newMessage.id)
            );

          if(!alreadyExists){

            messages.push(newMessage);

            messages.sort(
              (a,b)=>
                new Date(a.created_at) -
                new Date(b.created_at)
            );

          }


          /*
            If admin sent message,
            notify client.
          */

          if(
            newMessage.sender_type === "admin"
          ){

            unreadMessages++;

            updateChatBadge();

            playNotificationSound();

            showToast(
              "New message",
              newMessage.message || "You received a new message."
            );

            /*
              If currently on chat,
              render immediately.
            */

            if(currentView === "chat"){
              renderChat();
              scrollChatToBottom();
              unreadMessages = 0;
              updateChatBadge();
            }

          }

          else{

            /*
              Client's own message can appear
              instantly as well.
            */

            if(currentView === "chat"){
              renderChat();
              scrollChatToBottom();
            }

          }

        }
      )


      /* =========================
         PROJECT
      ========================= */

      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"projects",
          filter:`id=eq.${projectId}`
        },
        payload => {

          project = {
            ...project,
            ...payload.new
          };

          /*
            Re-render current page
          */

          renderCurrentView();

          showToast(
            "Project updated",
            "Your project information has been updated."
          );

        }
      )


      /* =========================
         DOCUMENTS
      ========================= */

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"documents",
          filter:`project_id=eq.${projectId}`
        },
        payload => {

          const item =
            payload.new;

          if(
            !documents.some(
              d => String(d.id) === String(item.id)
            )
          ){

            documents.unshift(item);

          }

          if(currentView === "documents"){
            renderDocuments();
          }

          playNotificationSound();

          showToast(
            "New document",
            item.file_name || "A new document was added."
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"documents",
          filter:`project_id=eq.${projectId}`
        },
        payload => {

          const index =
            documents.findIndex(
              d =>
                String(d.id) ===
                String(payload.new.id)
            );

          if(index !== -1){

            documents[index] = {
              ...documents[index],
              ...payload.new
            };

          }

          if(currentView === "documents"){
            renderDocuments();
          }

        }
      )


      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"documents",
          filter:`project_id=eq.${projectId}`
        },
        payload => {

          documents =
            documents.filter(
              d =>
                String(d.id) !==
                String(payload.old.id)
            );

          if(currentView === "documents"){
            renderDocuments();
          }

        }
      )


      /* =========================
         INVOICES
      ========================= */

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"invoices",
          filter:`client_id=eq.${user.id}`
        },
        payload => {

          const item =
            payload.new;

          if(
            !invoices.some(
              i =>
                String(i.id) ===
                String(item.id)
            )
          ){

            invoices.unshift(item);

          }

          if(currentView === "invoices"){
            renderInvoices();
          }

          playNotificationSound();

          showToast(
            "New invoice",
            item.title ||
            item.invoice_number ||
            "A new invoice is available."
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"invoices",
          filter:`client_id=eq.${user.id}`
        },
        payload => {

          const index =
            invoices.findIndex(
              i =>
                String(i.id) ===
                String(payload.new.id)
            );

          if(index !== -1){

            invoices[index] = {
              ...invoices[index],
              ...payload.new
            };

          }

          if(currentView === "invoices"){
            renderInvoices();
          }

          showToast(
            "Invoice updated",
            payload.new.title ||
            payload.new.invoice_number ||
            "An invoice was updated."
          );

        }
      )


      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"invoices",
          filter:`client_id=eq.${user.id}`
        },
        payload => {

          invoices =
            invoices.filter(
              i =>
                String(i.id) !==
                String(payload.old.id)
            );

          if(currentView === "invoices"){
            renderInvoices();
          }

        }
      )


      /* =========================
         CREDENTIALS
      ========================= */

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"project_credentials",
          filter:`project_id=eq.${projectId}`
        },
        payload => {

          const item =
            payload.new;

          /*
            Only accept credentials
            belonging to this client.
          */

          if(
            String(item.client_id) !==
            String(user.id)
          ){
            return;
          }

          if(
            !credentials.some(
              c =>
                String(c.id) ===
                String(item.id)
            )
          ){

            credentials.unshift(item);

          }

          if(currentView === "credentials"){
            renderCredentials();
          }

        }
      )


      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"project_credentials",
          filter:`project_id=eq.${projectId}`
        },
        payload => {

          if(
            String(payload.new.client_id) !==
            String(user.id)
          ){
            return;
          }

          const index =
            credentials.findIndex(
              c =>
                String(c.id) ===
                String(payload.new.id)
            );

          if(index !== -1){

            credentials[index] = {
              ...credentials[index],
              ...payload.new
            };

          }

          if(currentView === "credentials"){
            renderCredentials();
          }

        }
      )


      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"project_credentials",
          filter:`project_id=eq.${projectId}`
        },
        payload => {

          credentials =
            credentials.filter(
              c =>
                String(c.id) !==
                String(payload.old.id)
            );

          if(currentView === "credentials"){
            renderCredentials();
          }

        }
      )


      .subscribe(
        status => {

          setConnectionStatus(status);

          console.log(
            "Realtime status:",
            status
          );

        }
      );

}

async function saveCredential(event){

  event.preventDefault();

  if(!project || !user){
    return;
  }


  const button =
    event.target.querySelector(
      "button[type='submit']"
    );

  button.disabled = true;
  button.textContent = "Saving...";


  try{

    const payload = {

      project_id:project.id,

      client_id:user.id,

      service_name:
        document.getElementById(
          "credentialService"
        ).value.trim(),

      login_url:
        document.getElementById(
          "credentialUrl"
        ).value.trim(),

      username:
        document.getElementById(
          "credentialUsername"
        ).value.trim(),

      password:
        document.getElementById(
          "credentialPassword"
        ).value,

      notes:
        document.getElementById(
          "credentialNotes"
        ).value.trim()

    };


    const {
      data,
      error
    } =
      await supabaseClient
        .from("project_credentials")
        .insert(payload)
        .select()
        .single();


    if(error){
      throw error;
    }


    /*
      Add locally immediately.
      Realtime will ignore duplicate.
    */

    if(data){

      credentials.unshift(data);

    }


    renderCredentials();

    showToast(
      "Credential saved",
      "The credential has been added successfully."
    );


  }catch(error){

    showToast(
      "Unable to save",
      error.message ||
      "Could not save credential."
    );

  }finally{

    button.disabled = false;
    button.textContent = "Save Credential";

  }

}

function renderChat(){

  if(!project){

    content.innerHTML = `
      <div class="page-header">

      </div>

        <div class="empty">
          A project is required before chat can be used.

    `;

    return;

  }


  content.innerHTML = `

    <div class="page-header">

      <h1>Chat</h1>

      <p>
        Chat directly with your project team. Messages appear in real time.
      </p>

    </div>


    <div class="card chat-shell">

      <div
        id="chatMessages"
        class="chat-messages"
      >

        ${messagesHtml()}

      </div>


      <form
        id="chatForm"
        class="chat-input"
      >

        <textarea
          id="messageInput"
          placeholder="Write your message..."
          rows="1"
        ></textarea>

        <button
          class="send-btn"
          type="submit"
        >
          Send
        </button>

      </form>

    </div>

  `;


  const form =
    document.getElementById("chatForm");

  const textarea =
    document.getElementById("messageInput");


  if(form){

    form.addEventListener(
      "submit",
      sendMessage
    );

  }


  if(textarea){

    textarea.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter" &&
          !event.shiftKey
        ){

          event.preventDefault();

          form.requestSubmit();

        }

      }
    );

  }


  requestAnimationFrame(
    scrollChatToBottom
  );

}


function messagesHtml(){

  if(!messages.length){

    return `
      <div class="empty">
        <div class="empty-icon">💬</div>
        No messages yet.
        <p>Start the conversation below.</p>
      </div>
    `;

  }


  return messages.map(message => {

    const isClient =
      message.sender_type === "client";

    return `

      <div class="message-row ${
        isClient
        ? "client"
        : "admin"
      }">

        <div class="message-bubble">

          <div class="message-name">
            ${escapeHtml(
              message.sender_name ||
              (isClient ? "You" : "Admin")
            )}
          </div>

          <div>
            ${escapeHtml(
              message.message || ""
            ).replace(/\n/g,"<br>")}
          </div>

          <div class="message-time">
            ${formatDateTime(message.created_at)}
          </div>

        </div>

      </div>

    `;

  }).join("");

}


function scrollChatToBottom(){

  const box =
    document.getElementById(
      "chatMessages"
    );

  if(box){

    box.scrollTop =
      box.scrollHeight;

  }

}


async function sendMessage(event){

  event.preventDefault();

  if(!project || !user){
    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );

  const button =
    event.target.querySelector(
      "button[type='submit']"
    );

  const message =
    input.value.trim();


  if(!message){
    return;
  }


  button.disabled = true;
  button.textContent = "...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          project_id:project.id,
          sender_type:"client",
          sender_name:
            client?.full_name ||
            user.email ||
            "Client",
          message:message
        })
        .select()
        .single();


    if(error){
      throw error;
    }


    /*
      Add instantly.
      Realtime duplicate will be ignored.
    */

    if(data){

      if(
        !messages.some(
          m =>
            String(m.id) ===
            String(data.id)
        )
      ){

        messages.push(data);

        messages.sort(
          (a,b)=>
            new Date(a.created_at) -
            new Date(b.created_at)
        );

      }

    }


    input.value = "";

    renderChat();

    scrollChatToBottom();


  }catch(error){

    showToast(
      "Message failed",
      error.message ||
      "Unable to send message."
    );

  }finally{

    button.disabled = false;
    button.textContent = "Send";

  }

}

/*
  Any first interaction can unlock
  sound after user clicks somewhere.
*/

document.addEventListener(
  "click",
  async function unlockAudio(){

    if(!soundEnabled){

      try{

        if(!audioContext){

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }

        if(
          audioContext.state ===
          "suspended"
        ){

          await audioContext.resume();

        }

      }catch{}

    }

  },
  {
    once:false,
    passive:true
  }
);
