
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musical Fountain Preview</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#08111f;color:#eaf4ff;
  font-family:Arial,sans-serif;padding:20px
}
.container{max-width:1100px;margin:auto}
h1{margin:0 0 8px;font-size:26px}
.sub{color:#9fb4ca;margin-bottom:20px}
.panel{
  background:#111f31;border:1px solid #263c55;
  border-radius:14px;padding:16px;margin-bottom:16px
}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.upload{
  background:#147de0;color:white;border:0;
  border-radius:8px;padding:11px 15px;
  cursor:pointer;font-weight:bold
}
button:hover,.upload:hover{background:#2697ff}
button.secondary{background:#34465c}
button.green{background:#0c9b70}
input[type=file]{display:none}
select,input[type=number]{
  background:#0a1727;color:white;border:1px solid #40546b;
  border-radius:7px;padding:9px
}
label{font-size:13px;color:#b9cde0}
canvas{
  display:block;width:100%;height:auto;
  background:#061321;border-radius:12px;
  border:1px solid #29435d
}
.status{color:#8dd7ff;font-size:13px;margin-top:10px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px}
input[type=range]{width:160px}
#time{font-variant-numeric:tabular-nums;color:#b9d9ff}
#result{color:#a9c8e6;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="container">
  <h1>Musical Dancing Fountain</h1>
  <div class="sub">Audio-based fountain animation preview</div>

  <div class="panel">
    <div class="controls">
      <label class="upload" for="upload">Upload MP3 / WAV</label>
      <input id="upload" type="file" accept=".mp3,.wav,audio/*">

      <select id="demo">
        <option value="">Select demo music</option>
        <option value="calm">Demo 1 — Calm</option>
        <option value="dance">Demo 2 — Dance Beat</option>
        <option value="pulse">Demo 3 — Fast Pulse</option>
      </select>
      <button class="secondary" id="play">Play Music</button>
      <button class="secondary" id="stop">Stop</button>
    </div>
    <div class="status" id="fileStatus">No music selected</div>
  </div>

  <div class="panel">
    <canvas id="fountain" width="1000" height="500"></canvas>
    <div class="status">
      Grey nozzles = inactive | Blue, cyan and pink = active
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>Preview start time (seconds)</label>
        <input id="startTime" type="number" min="0" value="0" step="1">
      </div>
      <div class="field">
        <label>Preview duration</label>
        <input type="number" value="4" disabled>
      </div>
      <div class="field">
        <label>Jet height</label>
        <input id="jetHeight" type="range" min="30" max="180" value="100">
      </div>
      <div class="field">
        <label>Audio sensitivity</label>
        <input id="sensitivity" type="range" min="1" max="10" value="3">
      </div>
    </div>

    <div class="controls" style="margin-top:18px">
      <button class="green" id="preview">▶ Preview 4 Seconds</button>
      <button class="secondary" id="analyse">Find Loudest 4 Seconds</button>
    </div>
    <div id="time" style="margin-top:12px">00:00 / 00:00</div>
    <div id="result">Upload music or select a demo, then start preview.</div>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("fountain");
const ctx = canvas.getContext("2d");
const audio = new Audio();
audio.preload = "auto";

let audioContext = null;
let analyser = null;
let sourceNode = null;
let frequencyData = null;
let currentObjectURL = null;
let active = false;
let previewEnd = 0;
let previewStart = 0;
let animationFrame = 0;
let points = [];
let lastLevel = 0;
let demoBuffer = null;

function setupAudio() {
  if (audioContext) return;

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.72;
  frequencyData = new Uint8Array(analyser.frequencyBinCount);

  sourceNode = audioContext.createMediaElementSource(audio);
  sourceNode.connect(analyser);
  analyser.connect(audioContext.destination);
}

function makeDemo(type) {
  const sampleRate = 44100;
  const duration = 25;
  const length = sampleRate * duration;
  const buffer = audioContext.createBuffer(2, length, sampleRate);

  for (let channel = 0; channel < 2; channel++) {
    const data = buffer.getChannelData(channel);

    for (let i = 0; i < length; i++) {
      const t = i / sampleRate;
      let value = 0;

      if (type === "calm") {
        value =
          Math.sin(2 * Math.PI * 220 * t) * 0.16 +
          Math.sin(2 * Math.PI * 330 * t) * 0.10 +
          Math.sin(2 * Math.PI * 440 * t) * 0.08;
        value *= 0.6 + 0.4 * Math.sin(2 * Math.PI * 0.5 * t);
      } else if (type === "dance") {
        const beat = Math.pow(Math.max(0, Math.sin(2 * Math.PI * 2 * t)), 8);
        value =
          Math.sin(2 * Math.PI * 110 * t) * 0.22 +
          Math.sin(2 * Math.PI * 440 * t) * 0.10 +
          beat * 0.35;
      } else {
        const beat = Math.pow(Math.max(0, Math.sin(2 * Math.PI * 3 * t)), 12);
        value =
          Math.sin(2 * Math.PI * 150 * t) * 0.18 +
          Math.sin(2 * Math.PI * 600 * t) * 0.12 +
          beat * 0.4;
      }

      data[i] = value * (0.85 + 0.15 * Math.sin(2 * Math.PI * 0.1 * t));
    }
  }
  return buffer;
}

function bufferToWav(buffer) {
  const channels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const frames = buffer.length;
  const bytes = new ArrayBuffer(44 + frames * channels * 2);
  const view = new DataView(bytes);

  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) {
      view.setUint8(offset + i, str.charCodeAt(i));
    }
  }

  writeString(0, "RIFF");
  view.setUint32(4, 36 + frames * channels * 2, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * channels * 2, true);
  view.setUint16(32, channels * 2, true);
  view.setUint16(34, 16, true);
  writeString(36, "data");
  view.setUint32(40, frames * channels * 2, true);

  let offset = 44;
  for (let i = 0; i < frames; i++) {
    for (let c = 0; c < channels; c++) {
      let sample = Math.max(-1, Math.min(1, buffer.getChannelData(c)[i]));
      view.setInt16(offset, sample < 0 ? sample * 32768 : sample * 32767, true);
      offset += 2;
    }
  }
  return new Blob([bytes], { type: "audio/wav" });
}

function loadDemo(type) {
  setupAudio();
  demoBuffer = makeDemo(type);
  const wav = bufferToWav(demoBuffer);

  if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
  currentObjectURL = URL.createObjectURL(wav);
  audio.src = currentObjectURL;
  audio.load();

  $("fileStatus").textContent = "Loaded: " + type + " demo music";
  $("result").textContent = "Demo music ready. Press Preview 4 Seconds.";
  $("startTime").value = 0;
}

$("demo").addEventListener("change", e => {
  if (e.target.value) loadDemo(e.target.value);
});

$("upload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  setupAudio();

  if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
  currentObjectURL = URL.createObjectURL(file);
  audio.src = currentObjectURL;
  audio.load();

  $("fileStatus").textContent = "Loaded: " + file.name;
  $("result").textContent = "Music loaded. Press Preview 4 Seconds.";
  $("demo").value = "";
});

function buildPoints() {
  points = [];
  const cx = 500;
  const cy = 250;

  // Outer rectangle
  for (let x = 100; x <= 900; x += 50) {
    points.push({x, y: 105, group: "top"});
    points.push({x, y: 395, group: "bottom"});
  }
  for (let y = 145; y <= 355; y += 42) {
    points.push({x: 85, y, group: "left"});
    points.push({x: 915, y, group: "right"});
  }

  // Inner fountain rings
  for (let ring = 1; ring <= 3; ring++) {
    const radiusX = 85 * ring;
    const radiusY = 45 * ring;
    const count = 12 + ring * 8;

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count;
      points.push({
        x: cx + Math.cos(angle) * radiusX,
        y: cy + Math.sin(angle) * radiusY,
        group: "center"
      });
    }
  }

  // Central nozzles
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI * 2 * i / 8;
    points.push({
      x: cx + Math.cos(angle) * 25,
      y: cy + Math.sin(angle) * 18,
      group: "center"
    });
  }
}

function getLevel() {
  if (!analyser || !active) return 0;

  analyser.getByteFrequencyData(frequencyData);

  let sum = 0;
  let count = 0;

  // Use useful audio frequencies
  for (let i = 2; i < frequencyData.length * 0.65; i++) {
    sum += frequencyData[i];
    count++;
  }

  const average = count ? sum / count / 255 : 0;
  const sensitivity = Number($("sensitivity").value);
  const amplified = average * sensitivity * 2.5;

  lastLevel = lastLevel * 0.55 + amplified * 0.45;
  return Math.min(1, lastLevel);
}

function drawBase() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Pool
  ctx.fillStyle = "#0a2941";
  ctx.fillRect(40, 55, 920, 390);

  ctx.strokeStyle = "#39708e";
  ctx.lineWidth = 3;
  ctx.strokeRect(40, 55, 920, 390);

  // Pool water texture
  ctx.strokeStyle = "rgba(95,190,230,.12)";
  ctx.lineWidth = 1;
  for (let y = 80; y < 440; y += 35) {
    ctx.beginPath();
    ctx.moveTo(50, y);
    ctx.lineTo(950, y);
    ctx.stroke();
  }

  ctx.fillStyle = "#9bc8df";
  ctx.font = "14px Arial";
  ctx.fillText("MUSICAL FOUNTAIN POOL — SIMULATED LAYOUT", 345, 30);

  // Inactive nozzles
  points.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#647687";
    ctx.fill();
    ctx.strokeStyle = "#b0bdc8";
    ctx.lineWidth = 1;
    ctx.stroke();
  });
}

function drawFountain() {
  drawBase();

  if (active) {
    const level = getLevel();
    const now = performance.now();
    const maxHeight = Number($("jetHeight").value);

    points.forEach((p, i) => {
      const wave = (Math.sin(now / 150 + i * 1.7) + 1) / 2;
      const groupFactor = p.group === "center" ? 1.15 : 0.85;
      const power = Math.max(0, level * (0.35 + wave * 0.9) * groupFactor);

      if (power > 0.025) {
        const jet = Math.min(maxHeight, 15 + power * maxHeight);
        const hue = 175 + (i * 13 + now / 30) % 150;
        const color = `hsl(${hue},100%,65%)`;

        // Water stream
        ctx.beginPath();
        ctx.moveTo(p.x, p.y - 3);
        ctx.quadraticCurveTo(
          p.x - 4, p.y - jet * 0.55,
          p.x + Math.sin(now / 180 + i) * 5, p.y - jet
        );
        ctx.strokeStyle = color;
        ctx.lineWidth = 2 + power * 3;
        ctx.shadowBlur = 12;
        ctx.shadowColor = color;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Coloured nozzle
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6 + power * 3, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        // Water spray
        ctx.beginPath();
        ctx.arc(
          p.x + Math.sin(now / 100 + i) * 5,
          p.y - jet,
          2 + power * 2, 0, Math.PI * 2
        );
        ctx.fillStyle = "#ffffff";
        ctx.fill();
      }
    });
  }
  animationFrame = requestAnimationFrame(drawFountain);
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

function updateClock() {
  const duration = audio.duration || 0;
  $("time").textContent =
    formatTime(audio.currentTime) + " / " + formatTime(duration);
}

audio.addEventListener("timeupdate", updateClock);

async function startPlayback(start, duration) {
  if (!audio.src) {
    $("result").textContent = "Please upload music or select a demo first.";
    return;
  }

  setupAudio();
  await audioContext.resume();

  const total = audio.duration || 0;
  if (total <= 0) {
    $("result").textContent = "Audio is still loading. Please try again.";
    return;
  }

  start = Math.max(0, Math.min(start, Math.max(0, total - 0.1)));
  duration = Math.min(duration, total - start);

  if (duration <= 0) {
    $("result").textContent = "Selected preview time is outside the music.";
    return;
  }

  audio.pause();
  audio.currentTime = start;
  active = true;
  lastLevel = 0;
  previewStart = start;
  previewEnd = performance.now() + duration * 1000;

  try {
    await audio.play();
    $("result").textContent = "Preview playing — fountain animation active.";
  } catch (err) {
    active = false;
    $("result").textContent = "Browser playback error: " + err.message;
    return;
  }

  setTimeout(() => {
    if (active && performance.now() >= previewEnd - 100) {
      stopPlayback();
      $("result").textContent = "4-second preview completed.";
    }
  }, duration * 1000 + 100);
}

function stopPlayback() {
  active = false;
  audio.pause();
  lastLevel = 0;
  updateClock();
}

$("preview").addEventListener("click", () => {
  const start = Math.max(0, Number($("startTime").value) || 0);
  startPlayback(start, 4);
});

$("play").addEventListener("click", async () => {
  if (!audio.src) {
    $("result").textContent = "Please upload music or select a demo first.";
    return;
  }
  setupAudio();
  await audioContext.resume();
  active = true;
  previewEnd = Infinity;
  try {
    await audio.play();
    $("result").textContent = "Music playing — fountain animation active.";
  } catch (err) {
    active = false;
    $("result").textContent = err.message;
  }
});

$("stop").addEventListener("click", stopPlayback);

audio.addEventListener("ended", () => {
  active = false;
});

$("analyse").addEventListener("click", async () => {
  if (!audio.src) {
    $("result").textContent = "Please upload music or select a demo first.";
    return;
  }

  setupAudio();
  $("result").textContent = "Analysing audio...";

  try {
    const response = await fetch(audio.src);
    const arrayBuffer = await response.arrayBuffer();
    const decoded = await audioContext.decodeAudioData(arrayBuffer);
    const data = decoded.getChannelData(0);
    const sampleRate = decoded.sampleRate;
    const windowSize = Math.floor(sampleRate * 4);
    const hop = Math.floor(sampleRate * 0.5);

    if (data.length < windowSize) {
      $("result").textContent = "Music is shorter than 4 seconds.";
      return;
    }

    let bestStart = 0;
    let bestEnergy = -1;

    for (let start = 0; start + windowSize < data.length; start += hop) {
      let energy = 0;

      for (let i = start; i < start + windowSize; i += 8) {
        energy += data[i] * data[i];
      }

      if (energy > bestEnergy) {
        bestEnergy = energy;
        bestStart = start;
      }
    }

    const seconds = bestStart / sampleRate;
    $("startTime").value = seconds.toFixed(1);
    $("result").textContent =
      "Loudest 4-second section found at " + seconds.toFixed(1) +
      " seconds. Press Preview to listen and see the animation.";
  } catch (err) {
    $("result").textContent = "Analysis failed: " + err.message;
  }
});

buildPoints();
drawFountain();

})();
</script>
</body>
</html>
