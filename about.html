<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Automation with Sajjad Zaidi</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body{
            margin:0;
            background:#0A0A0A;
            color:#fff;
            font-family:Arial,Helvetica,sans-serif;
        }

        .about-hero{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:80px 20px;
        }

        .container{
            max-width:900px;
            margin:auto;
        }

        h1{
            font-size:64px;
            margin-bottom:20px;
        }

        h1 span{
            color:#D6FF00;
        }

        p{
            font-size:20px;
            line-height:1.8;
            color:#bdbdbd;
            max-width:750px;
            margin:auto;
        }

        .btn{
            display:inline-block;
            margin-top:40px;
            padding:16px 34px;
            background:#D6FF00;
            color:#000;
            text-decoration:none;
            font-weight:700;
            border-radius:50px;
            transition:.3s;
        }

        .btn:hover{
            transform:translateY(-3px);
        }

        @media(max-width:768px){

            h1{
                font-size:42px;
            }

            p{
                font-size:18px;
            }

        }
    </style>

</head>

<body>

<section class="about-hero">

<div class="container">

<h1>About <span>Automation with Sajjad Zaidi</span></h1>

<p>
We help businesses replace repetitive manual work with AI-powered systems,
voice agents, chatbots, CRM automation, and intelligent workflows built using
modern automation platforms.
</p>

<a href="index.html" class="btn">
Back to Home
</a>

</div>

</section>

</body>
</html>
